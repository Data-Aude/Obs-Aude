  if (/^taux|^part |^proportion/.test(t) && !/rapporte|population de reference/.test(p.join(' ').toLowerCase())) p.push('Proportion exprimée ' + (unit === '%' ? 'en pourcentage' : 'par rapport à la population concernée') + '.');
  if (/^nombre|^effectif/.test(t)) p.push('Effectif recensé dans le département.');
  if (/\bASE\b|aide sociale a l'enfance|placement|aemo|\baed\b/i.test(label)) p.push('ASE = aide sociale à l\'enfance : mesures éducatives (AED, AEMO) et mesures de placement.');
  if (/\bAPA\b/.test(label)) p.push('APA = allocation personnalisée d\'autonomie, versée aux personnes âgées en perte d\'autonomie.');
  if (/\bPCH\b|ACTP/.test(label)) p.push('PCH = prestation de compensation du handicap ; ACTP = allocation compensatrice pour tierce personne.');
  if (/\bRSA\b/.test(label)) p.push('RSA = revenu de solidarité active.');
  p.push('Source : DREES, indicateurs sociaux départementaux (ISD), jeu « ' + dreesDsTitle(ds) + ' » — dernier millésime publié.');
  return p.join(' ');
}
// Sélection d'une LIGNE par libellé EXACT (insensible à la casse, aux accents, à la ponctuation).
// Le jeu contient de nombreux libellés proches (« Part des AED dans l'ensemble des mesures d'ASE »
// vs « Taux de mesures d'ASE »…) : une correspondance par mots-clés donnait de mauvais indicateurs.
function dreesCandidates(rows, labelField, yearField, rule) {
  var target = fuseFr(rule.exact);
  return rows.filter(function(rec) { return fuseFr(rec[labelField] || '') === target; })
    .sort(function(a, b) { var ya = yearField ? (a[yearField] || 0) : 0, yb = yearField ? (b[yearField] || 0) : 0; return yb - ya; });
}

// Lit toutes les pages d'un jeu (100 lignes max par appel) — sans ça, seules 100 lignes
// arbitraires (souvent d'anciennes années) étaient vues pour l'Aude.
async function fetchDreesPages(dsKey, whereClause, maxPages) {
  var id = DREES_RESOLVED_ID[dsKey], all = [];
  for (var p = 0; p < (maxPages || 8); p++) {
    var url = DREES_BASE + id + '/records?where=' + encodeURIComponent(whereClause) + '&limit=100&offset=' + (p * 100);
    var r = await fetch(url);
    if (!r.ok) { if (p === 0) throw new Error('HTTP ' + r.status); break; }
    var data = await r.json();
    var res = data.results || [];
    all = all.concat(res);
    if (res.length < 100) break;
  }
  return all;
}

// Enregistre une série {année: valeur} dans DREES_TS (au moins 2 points pour tracer une courbe)
function setTs(id, code, series) {
  var ok = {};
  Object.keys(series || {}).forEach(function(y) { var v = series[y]; if (typeof v === 'number' && !isNaN(v)) ok[y] = v; });
  if (Object.keys(ok).length < 2) return false;
  (DREES_TS[id] = DREES_TS[id] || {})[code] = ok;
  return true;
}
// Exécute des tâches asynchrones avec au plus n requêtes en parallèle
async function runPool(tasks, n) {
  var i = 0;
  async function worker() { while (i < tasks.length) { var t = tasks[i++]; try { await t(); } catch (e) { /* géré par la tâche */ } } }
  await Promise.all(Array.from({ length: n }, worker));
}
// Moyenne annuelle d'un indicateur DREES (France ou Occitanie) calculée côté serveur (group_by)
// Moyennes France métropolitaine / Occitanie PAR ANNÉE, calculées sur les valeurs départementales (comme le tableau de statistiques)
async function fetchDreesSeriesStats(dsKey, deptField, labelField, yearField, exactLabel, codeIsd, scale, minYear) {
  var where = codeIsd ? 'code_isd="' + codeIsd + '"' : labelField + '="' + String(exactLabel).replace(/"/g, '\\"') + '"';
  if (yearField && typeof minYear === 'number') where += ' AND ' + yearField + '>=' + minYear;
  var rows = await fetchDreesPages(dsKey, where, 14);
  if (labelField && exactLabel) rows = rows.filter(function(rr) { return fuseFr(rr[labelField] || '') === fuseFr(exactLabel); });
  var byY = {};
  rows.forEach(function(rr) {
    var y = yearField ? rr[yearField] : null, dc = deptCodeOf(rr[deptField]), v = rr.value;
    if (y == null || dc === null || v === null || v === undefined || v === '') return;
    var x = (typeof v === 'string' ? parseFloat(v.replace(',', '.')) : v) * (scale || 1);
    if (isNaN(x)) return;
    (byY[y] = byY[y] || {})[dc] = x;
  });
  var fra = {}, occ = {}, str = {};
  Object.keys(byY).forEach(function(y) {
    var f = statsAndRankFor(byY[y], null), o = statsAndRankFor(byY[y], OCC), st = statsAndRankFor(byY[y], STRATE);
    if (f.total >= 20) fra[y] = f.stats.mean;
    if (o.total) occ[y] = o.stats.mean;
    if (st.total >= 8) str[y] = st.stats.mean;
  });
  return { FRA: fra, OCC: occ, STR: str };
}
async function fetchDreesAgg(dsKey, labelField, yearField, exact, extraWhere, scale) {
  var where = labelField + '="' + exact + '"' + (extraWhere || '');
  var url = DREES_BASE + DREES_RESOLVED_ID[dsKey] + '/records?select=' + encodeURIComponent(yearField + ', avg(value) as moy') +
    '&where=' + encodeURIComponent(where) + '&group_by=' + encodeURIComponent(yearField) + '&order_by=' + encodeURIComponent(yearField) + '&limit=100';
  var r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  var d = await r.json(), out = {};
  (d.results || []).forEach(function(x) { if (x.moy != null && x[yearField] != null) out[x[yearField]] = x.moy * (scale || 1); });
  return out;
}

// Calcule n / moyenne / médiane / quartiles sur un tableau de valeurs numériques.
// Fonction générique, réutilisée par le connecteur DREES ET le connecteur CAF.
function computeStats(vals) {
  if (!vals.length) return { n: 0 };
  var s = vals.slice().sort(function(a, b) { return a - b; });
  var n = s.length;
  function q(p) { var pos = (n - 1) * p, b = Math.floor(pos), r = pos - b; return s[b + 1] !== undefined ? s[b] + r * (s[b + 1] - s[b]) : s[b]; }
  return { n: n, mean: s.reduce(function(a, b) { return a + b; }, 0) / n, median: q(0.5), q1: q(0.25), q3: q(0.75) };
}
// Ne garde que les départements de France métropolitaine, chacun UNE seule fois :
//  - codes 01…95, 2A, 2B (hors DROM, totaux, régions, libellés non reconnus) ;
//  - 69D (Rhône) est ramené à 69 ; 69M (Métropole de Lyon) est écartée pour ne pas compter Lyon deux fois ;
//  - 6AE (Collectivité européenne d'Alsace) n'est conservée que si 67 et 68 sont absents (sinon l'Alsace compterait 3 fois).
function cleanDeptMap(map) {
  var out = {};
  Object.keys(map || {}).forEach(function(k) {
    var c = String(k).toUpperCase();
    if (c === '69D') c = '69';
    if (c === '69M' || c === '6AE') return;
    if (!/^(0[1-9]|[1-8]\d|9[0-5]|2A|2B)$/.test(c) || c === '20') return;
    out[c] = map[k];
  });
  if (map && map['6AE'] !== undefined && out['67'] === undefined && out['68'] === undefined) out['6AE'] = map['6AE'];
  return out;
}
// Classe les départements d'un snap {dept: valeur} (rang 1 = valeur la plus haute ; ex æquo = même rang),
// filtré sur une liste de codes (Occitanie / Strate) ou sur la France métropolitaine, et calcule les stats.
function statsAndRankFor(snapMap, deptFilter) {
  var clean = cleanDeptMap(snapMap);
  var entries = Object.keys(clean)
    .filter(function(d) { return !deptFilter || deptFilter.indexOf(d) >= 0; })
    .map(function(d) { return { dept: d, val: clean[d] }; })
    .filter(function(e) { return typeof e.val === 'number' && !isNaN(e.val); });
  if (!entries.length) return { stats: { n: 0 }, rank: null, total: 0 };
  var rank = null, audeE = entries.find(function(e) { return e.dept === '11'; });
  if (audeE) rank = 1 + entries.filter(function(e) { return e.val > audeE.val; }).length;
  return { stats: computeStats(entries.map(function(e) { return e.val; })), rank: rank, total: entries.length };
}

async function loadDREES() {
  addLog('⏳', 'DREES : détection des champs de l\'API sur data.drees...');
  var dsUsed = {};
  DREES_RULES.forEach(function(r) { dsUsed[r.ds] = true; });
  Object.keys(DREES_DATASETS).forEach(function(k) { dsUsed[k] = true; }); // tous les jeux : détection automatique des libellés

  var rowsByDs = {}, labelFieldByDs = {}, yearFieldByDs = {}, deptFieldByDs = {};
  for (var dsKey in dsUsed) {
    try {
      var fields = await getDreesFields(dsKey);
      if (!fields.length) continue;
      var deptField = findDreesDim(fields, 'dept');
      var yearField = findDreesDim(fields, 'annee');
      var labelField = findDreesLabelField(fields);
      if (!deptField || !labelField) { addLog('⚠️', 'DREES (' + dsKey + ') : champ département ou libellé introuvable.'); continue; }
      // Le format du département peut varier (« 11 », « 011 », 11, « Aude »…) : on essaie plusieurs écritures.
      var rows = [], clauses = [deptField + '="11"', deptField + '="011"', deptField + '=11', deptField + '="Aude"', deptField + '="AUDE"'];
      for (var ci = 0; ci < clauses.length && !rows.length; ci++) {
        try { rows = await fetchDreesPages(dsKey, clauses[ci], 20); } catch (eCl) { rows = []; }
        if (rows.length && ci > 0) addLog('ℹ️', 'DREES (' + dsKey + ') : filtre département accepté sous la forme « ' + clauses[ci] + ' ».');
      }
      if (!rows.length) { addLog('⚠️', 'DREES (' + dsKey + ') : 0 ligne pour l\'Aude (champ « ' + deptField + ' »).'); continue; }
      rowsByDs[dsKey] = rows; labelFieldByDs[dsKey] = labelField; yearFieldByDs[dsKey] = yearField; deptFieldByDs[dsKey] = deptField;
      var yrs = yearField ? Array.from(new Set(rows.map(function(x){ return x[yearField]; }))).sort().join(', ') : '?';
      addLog('ℹ️', 'DREES (' + dsKey + ') : ' + rows.length + ' lignes lues pour l\'Aude (années : ' + yrs + ').');
    } catch (e) {
      addLog('❌', 'DREES (' + dsKey + ') : erreur de connexion — ' + e.message);
    }
  }

  // Valeur des autres départements pour un indicateur identifié (même code_isd + même année),
  // pour reconstituer moyenne/médiane/quartiles/rangs.
  async function fetchDreesComparatif(dsKey, deptField, codeIsd, yearField, annee, scale, labelField, exactLabel) {
    if (!codeIsd || !yearField || annee == null) return null;
    try {
      var rows = await fetchDreesPages(dsKey, 'code_isd="' + codeIsd + '" AND ' + yearField + '=' + annee, 8);
      // Un même code_isd regroupe plusieurs indicateurs : on ne garde que celui dont le libellé est exactement le nôtre
      if (labelField && exactLabel) rows = rows.filter(function(rr) { return fuseFr(rr[labelField] || '') === fuseFr(exactLabel); });
      var snapMap = {};
      rows.forEach(function(rr) {
        var dc = rr[deptField], v = rr.value;
        if (dc == null || v === null || v === undefined || v === '') return;
        snapMap[deptCodeOf(dc) || String(dc)] = (typeof v === 'string' ? parseFloat(v.replace(',', '.')) : v) * (scale || 1);
      });
      return snapMap;
    } catch (e) { return null; }
  }

  if (typeof DREES_META === 'undefined') window.DREES_META = [];
  var prevIds = DREES_META.map(function(m) { return m.id; });
  var updated = 0;
  var tsTasks = [];

  for (var ri = 0; ri < DREES_RULES.length; ri++) {
    var rule = DREES_RULES[ri];
    var rows = rowsByDs[rule.ds], labelField = labelFieldByDs[rule.ds], yearField = yearFieldByDs[rule.ds], deptField = deptFieldByDs[rule.ds];
    if (!rows) continue;
    var cands = dreesCandidates(rows, labelField, yearField, rule);
    if (!cands.length) { addLog('⚠️', rule.id + ' : libellé « ' + rule.exact + ' » absent pour l\'Aude.'); continue; }
    var rec = cands[0];
    var sameYear = cands.filter(function(c) { return !yearField || c[yearField] === rec[yearField]; });
    var distinctVals = Array.from(new Set(sameYear.map(function(c) { return c.value; })));
    if (distinctVals.length > 1) {
      addLog('⚠️', rule.id + ' : ' + sameYear.length + ' lignes de même libellé et même année avec des valeurs différentes → ' +
        sameYear.map(function(c) { return '[' + c.code_isd + ' / ' + (c.source || 'source ?') + ' = ' + c.value + ']'; }).join(' ') + ' (première retenue).');
    }
    var val = rec.value;
    if (val === null || val === undefined || val === '') { addLog('⚠️', rule.id + ' : ligne trouvée mais valeur vide.'); continue; }
    var aude = (typeof val === 'string' ? parseFloat(val.replace(',', '.')) : val) * (rule.scale || 1);
    var annee = yearField ? rec[yearField] : null;
    var isNew = prevIds.indexOf(rule.id) < 0;
    var existing = DREES_META.find(function(m) { return m.id === rule.id; });
    var entry = existing || {
      id: rule.id, label: rule.label, unit: rule.unit, fmt: rule.fmt, themes: rule.themes,

      desc: rule.desc
    };
    entry.aude = aude;
    entry.annee = annee;
    entry.short = rule.label;
    entry.label = rec[labelField] || rule.label; // titre officiel COMPLET (jamais raccourci)
    if (rule.desc) entry.desc = rule.desc + ' Source : DREES, indicateurs sociaux départementaux (ISD), jeu « ' + dreesDsTitle(rule.ds) + ' ».';
    entry.source = 'DREES — data.drees (direct, indicateur: ' + rec[labelField] + ')';
    entry.isNew = isNew;
    if (!existing) DREES_META.push(entry);

    // Série de l'Aude sur toutes les années publiées (lignes déjà lues, aucune requête supplémentaire)
    var audeSeries = {};
    cands.forEach(function(c) {
      var y = yearField ? c[yearField] : null, v = c.value;
      if (y == null || audeSeries[y] !== undefined || v === null || v === undefined || v === '') return;
      audeSeries[y] = (typeof v === 'string' ? parseFloat(v.replace(',', '.')) : v) * (rule.scale || 1);
    });
    if (setTs(rule.id, '11', audeSeries)) { entry.has_ts = true; tsTasks.push({ rule: rule, labelField: labelField, yearField: yearField, deptField: deptField, exactLabel: rec[labelField], codeIsd: rec.code_isd, minYear: (typeof annee === 'number') ? annee - 9 : null }); }

    var codeIsd = rec.code_isd;
    var snapMap = codeIsd ? await fetchDreesComparatif(rule.ds, deptField, codeIsd, yearField, annee, rule.scale, labelField, rule.exact) : null;
    if (snapMap && Object.keys(snapMap).length > 1) {
      DREES_SNAP[rule.id] = snapMap;
      var frRes = statsAndRankFor(snapMap, null);
      var strRes = statsAndRankFor(snapMap, STRATE);
      var occRes = statsAndRankFor(snapMap, OCC);
      entry.stats_fr = frRes.stats; entry.rank_fr = frRes.rank; entry.total_fr = frRes.total; entry.fra = frRes.stats.mean;
      entry.stats_strate = strRes.stats; entry.rank_strate = strRes.rank; entry.total_strate = strRes.total;
      entry.stats_occ = occRes.stats; entry.rank_occ = occRes.rank; entry.total_occ = occRes.total; entry.occ = occRes.stats.mean;
      var allV = Object.keys(snapMap).map(function(k) { return snapMap[k]; }).filter(function(x) { return typeof x === 'number' && !isNaN(x); });
      var mx = Math.max.apply(null, allV), mn = Math.min.apply(null, allV);
      if (frRes.stats.median > 0 && mx > 20 * frRes.stats.median) {
        addLog('⚠️', rule.id + ' : échelles possiblement hétérogènes selon les départements (min ' + mn.toFixed(3) + ' / médiane ' + frRes.stats.median.toFixed(3) + ' / max ' + mx.toFixed(3) + ') — moyenne à interpréter avec prudence.');
      }
      addLog('✅', rule.id + ' (' + entry.label + ') : ' + aude + ' ' + (entry.unit || '') + ' — comparatif sur ' + frRes.total + ' départements (moy. ' + entry.fra.toFixed(2) + '), année ' + annee, isNew);
    } else {
      DREES_SNAP[rule.id] = { '11': aude };
      addLog('⚠️', rule.id + ' : valeur Aude récupérée (' + aude + ', ' + annee + ') mais comparatif national indisponible.');
    }
    updated++;
  }

  // ---------- Détection automatique : tous les autres libellés présents pour l'Aude ----------
  var autoAdded = 0;
  try {
    var ruleKeys = {};
    DREES_RULES.forEach(function(r) { ruleKeys[fuseFr(r.exact)] = 1; });
    var autoJobs = [], autoSeen = {}; // dédoublonnage par libellé, tous jeux confondus
    Object.keys(rowsByDs).forEach(function(dsKey2) {
      var groups = {}, lf = labelFieldByDs[dsKey2];
      rowsByDs[dsKey2].forEach(function(rr) {
        var lab = rr[lf]; if (!lab) return;
        var k = fuseFr(lab);
        if (ruleKeys[k] || autoSeen[k]) return;
        (groups[k] = groups[k] || { label: lab, rows: [] }).rows.push(rr);
      });
      Object.keys(groups).forEach(function(k) { autoSeen[k] = 1; autoJobs.push({ ds: dsKey2, lf: lf, yf: yearFieldByDs[dsKey2], df: deptFieldByDs[dsKey2], g: groups[k] }); });
    });
    var nbLabels = autoJobs.length;
    autoJobs = autoJobs.slice(0, 150);
    function hashStr(t) { var x = 0; for (var i = 0; i < t.length; i++) x = (x * 31 + t.charCodeAt(i)) | 0; return (x >>> 0).toString(36); }
    function dreesThemes(label, dsKey2) {
      var t = normFr(label), th = [];
      if (/rsa|insertion|revenu|pauvret|minima|chomage|emploi/.test(t)) th.push('social');
      if (/enfan|ase\b|jeunesse|mineur|placement|aemo|aed\b|adoption|protection de l/.test(t)) th.push('ase');
      if (/agee|apa\b|dependance|senior|vieill/.test(t)) th.push('ages');
      if (/handic|pch\b|aah\b|mdph/.test(t)) th.push('handicap');
      if (/depense|cout|financ|budget|recette|montant|epargne|dette|fiscal|\bcharges\b|€|euro/.test(t)) th.unshift('financier');
      if (!th.length) th.push(dsKey2 === 'enfance' ? 'ase' : 'social');
      return th;
    }
    await runPool(autoJobs.map(function(j) { return async function() {
      var num = function(v) { return typeof v === 'string' ? parseFloat(v.replace(',', '.')) : v; };
      var rowsG = j.g.rows.filter(function(rr) { var v = num(rr.value); return typeof v === 'number' && !isNaN(v); });
      if (!rowsG.length) return;
      if (j.yf) rowsG.sort(function(a, b) { return String(b[j.yf]).localeCompare(String(a[j.yf])); });
      var arec = rowsG[0], annee = j.yf ? arec[j.yf] : null, raw = num(arec.value);
      var snap = arec.code_isd ? await fetchDreesComparatif(j.ds, j.df, arec.code_isd, j.yf, annee, 1, j.lf, j.g.label) : null;
      var vals = snap ? Object.keys(snap).map(function(k) { return snap[k]; }).filter(function(x) { return typeof x === 'number' && !isNaN(x); }) : [raw];
      var mxv = Math.max.apply(null, vals.map(Math.abs)), lab = j.g.label, nl = normFr(lab);
      var isRate = /%|taux|part |proportion|pourcentage|ratio/.test(nl) || /%/.test(lab);
      var scale = (isRate && mxv <= 1.0001) ? 100 : 1, unit = '', fmtName;
      if (isRate && (scale === 100 || /%/.test(lab))) { unit = '%'; fmtName = 'pct1'; }
      else if (/€|euro|depense|montant|cout|budget/.test(nl)) { unit = '€'; fmtName = 'eur0'; }
      else if (vals.every(function(x) { return Number.isInteger(x); })) fmtName = 'int';
      else fmtName = 'dec1';
      var id = 'drees_' + j.ds + '_' + hashStr(fuseFr(lab));
      var isNew = prevIds.indexOf(id) < 0 && prevIds.length > 0;
      var existing = DREES_META.find(function(m) { return m.id === id; });
      var entry = existing || { id: id, occ: null, fra: null, rank_fr: null, rank_strate: null, rank_occ: null,
        total_fr: 96, total_strate: 11, total_occ: 13, stats_fr: {}, stats_strate: {}, stats_occ: {}, has_ts: false };
      entry.label = lab; // titre officiel complet
      entry.unit = unit; entry.fmt = fmtName; entry.themes = dreesThemes(lab, j.ds);
      entry.aude = raw * scale; entry.annee = annee;
      entry.source = 'DREES — data.drees (détecté automatiquement, indicateur: ' + lab + ')';
      entry.desc = ''; entry.descAuto = true; entry.dsTitle = dreesDsTitle(j.ds);
      entry.isNew = isNew;
      if (!existing) DREES_META.push(entry);
      var serie = {};
      rowsG.forEach(function(rr) { var y = j.yf ? rr[j.yf] : null; if (y != null && serie[y] === undefined) serie[y] = num(rr.value) * scale; });
      if (setTs(id, '11', serie)) {
        entry.has_ts = true;
        try {
          var srA = await fetchDreesSeriesStats(j.ds, j.df, j.lf, j.yf, lab, arec.code_isd, scale, (typeof annee === 'number') ? annee - 9 : null);
          setTs(id, 'FRA', srA.FRA); setTs(id, 'OCC', srA.OCC); setTs(id, 'STR', srA.STR);
        } catch (eSr) { /* série de l'Aude seule */ }
      }
      if (snap && Object.keys(snap).length > 1) {
        var sm = {}; Object.keys(snap).forEach(function(k) { sm[k] = snap[k] * scale; });
        DREES_SNAP[id] = sm;
        var fr2 = statsAndRankFor(sm, null), st2 = statsAndRankFor(sm, STRATE), oc2 = statsAndRankFor(sm, OCC);
        entry.stats_fr = fr2.stats; entry.rank_fr = fr2.rank; entry.total_fr = fr2.total; entry.fra = fr2.stats.mean;
        entry.stats_strate = st2.stats; entry.rank_strate = st2.rank; entry.total_strate = st2.total;
        entry.stats_occ = oc2.stats; entry.rank_occ = oc2.rank; entry.total_occ = oc2.total; entry.occ = oc2.stats.mean;
      } else { DREES_SNAP[id] = { '11': raw * scale }; }
      if (isNew) newCount++;
      autoAdded++;
    }; }), 5);
    if (nbLabels > autoJobs.length) addLog('⚠️', 'DREES : ' + nbLabels + ' libellés détectés, seuls les ' + autoJobs.length + ' premiers sont chargés automatiquement.');
  } catch (eAutoD) {
    addLog('⚠️', 'DREES : détection automatique interrompue (' + eAutoD.message + ').');
  }

  if (tsTasks.length) {
    var tsErr = null, tsOk = 0, jobs = [];
    tsTasks.forEach(function(t) {
      jobs.push(async function() {
        try {
          var ser = await fetchDreesSeriesStats(t.rule.ds, t.deptField, t.labelField, t.yearField, t.exactLabel, t.codeIsd, t.rule.scale, t.minYear);
          var okF = setTs(t.rule.id, 'FRA', ser.FRA), okO = setTs(t.rule.id, 'OCC', ser.OCC), okS = setTs(t.rule.id, 'STR', ser.STR);
          if (okF || okO || okS) tsOk++;
        } catch (e) { tsErr = tsErr || e.message; }
      });
    });
    await runPool(jobs, 6);
    addLog(tsOk ? 'ℹ️' : '⚠️', 'DREES : évolution — série de l\'Aude pour ' + tsTasks.length + ' indicateurs ; moyennes France/Occitanie calculées pour ' + tsOk + '/' + tsTasks.length + ' indicateurs' + (tsErr ? ' (erreur : ' + tsErr + ')' : '') + '.');
  }
  addLog((updated || autoAdded) ? '✅' : '⚠️', 'DREES : ' + (updated + autoAdded) + ' indicateur(s) chargé(s) (' + updated + '/' + DREES_RULES.length + ' configurés + ' + autoAdded + ' détectés automatiquement).');
}

  rebuildAllMeta();
  buildDash();
};
