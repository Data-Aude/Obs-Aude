    {url:'cd11_mds', label:'Maisons De la Solidarité', themes:['social','aude']},
  ];
  
  for (var i=0; i<datasets.length; i++) {
    var ds = datasets[i];
    try {
      var count = null;
      var url = 'https://opendata.aude.fr/api/explore/v2.1/catalog/datasets/'+ds.url+'/records?limit=1';
      var r = await fetch(url);
      if (r.ok) {
        var data = await r.json();
        count = data.total_count || 0;
      } else {
        var url1 = 'https://opendata.aude.fr/api/records/1.0/search/?dataset='+ds.url+'&rows=1';
        var r1 = await fetch(url1);
        if (!r1.ok) throw new Error('Erreur API Aude');
        var data1 = await r1.json();
        count = data1.nhits || 0;
      }
      
      var existing = AUDE_META.find(function(m){return m.id==='aude_'+ds.url;});
      var isNew = !existing;
      if (isNew && AUDE_META.length > 0) newCount++;
      
      if (existing) {
        existing.aude = count;
        existing.annee = new Date().getFullYear();
      } else {
        AUDE_META.push({
          id: 'aude_'+ds.url,
          label: ds.label+' (nb)',
          unit: 'établissements',
          fmt: 'int',
          themes: ds.themes,
          aude: count,
          occ: null, fra: null,
          rank_fr: null, rank_strate: null, rank_occ: null,
          total_fr: 96, total_strate: 11, total_occ: 13,
          stats_fr: {}, stats_strate: {}, stats_occ: {},
          has_ts: false,
          source: 'Open Data Aude',
          annee: new Date().getFullYear(),
          desc: 'Nombre d\''+ds.label+' dans le département de l\'Aude.',
          isNew: isNew
        });
      }
      addLog('✅', ds.label+': '+count+' établissements', true);
    } catch(e) {
      addLog('❌', ds.label+' erreur: '+e.message);
    }
  }
}

async function loadINSEE() {
  // Aucune valeur écrite en dur : tout vient de l'API Melodi de l'INSEE (accès libre, 30 requêtes/minute).
  addLog('⏳', 'INSEE : interrogation de l\'API Melodi (recensement + Filosofi)...');
  var BASE = 'https://api.insee.fr/melodi/data/';
  function dim(o, k) { return (o.dimensions || {})[k]; }
  function val(o) {
    var m = o.measures || {}, mv = m.OBS_VALUE_NIVEAU || m.OBS_VALUE || m[Object.keys(m)[0]] || {};
    var v = (typeof mv === 'object') ? mv.value : mv;
    return (v === undefined || v === null || isNaN(parseFloat(v))) ? null : parseFloat(v);
  }
  function depCode(o) {
    var m = /DEP-(\w+)$/.exec(String(dim(o, 'GEO') || ''));
    if (!m) return null;
    return m[1].length === 1 ? '0' + m[1] : m[1];
  }
  async function get(ds, geoParam, filters) {
    var r = await fetch(BASE + ds + '?' + geoParam + (filters || '') + '&maxResult=10000', { headers: { 'Accept': 'application/json' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var d = await r.json();
    return d.observations || [];
  }
  async function audeObs(ds) {
    var last = null, geos = ['DEP-11', '2023-DEP-11', '2022-DEP-11'];
    for (var i = 0; i < geos.length; i++) {
      try { var o = await get(ds, 'GEO=' + geos[i]); if (o.length) return o; last = '0 observation'; } catch (e) { last = e.message; }
    }
    throw new Error(last || 'échec');
  }
  function latestPeriod(obs) {
    var ps = Array.from(new Set(obs.map(function(o) { return String(dim(o, 'TIME_PERIOD')); }))).sort();
    return ps[ps.length - 1];
  }
  // Ramène chaque dimension « secondaire » (sexe…) à son total « _T » quand il existe
  function reduceTotals(pool, keep) {
    var names = Object.keys((pool[0] || {}).dimensions || {}).filter(function(k) { return k !== 'GEO' && k !== 'TIME_PERIOD' && keep.indexOf(k) < 0; });
    names.forEach(function(k) {
      var vals = Array.from(new Set(pool.map(function(o) { return dim(o, k); })));
      if (vals.length > 1 && vals.indexOf('_T') >= 0) pool = pool.filter(function(o) { return dim(o, k) === '_T'; });
    });
    return pool;
  }
  // Même requête pour tous les départements (comparatif). Le séparateur « + » n'étant pas garanti, on essaie 2 formes.
  async function allDeps(ds, sampleObs, keepDims) {
    var deps = Object.keys(DEPTS).filter(function(c) { return c !== '6AE'; });
    var filt = '';
    Object.keys((sampleObs[0] || {}).dimensions || {}).forEach(function(k) {
      if (k === 'GEO' || k === 'TIME_PERIOD' || keepDims.indexOf(k) >= 0) return;
      var vals = Array.from(new Set(sampleObs.map(function(o) { return dim(o, k); })));
      if (vals.indexOf('_T') >= 0) filt += '&' + k + '=_T';
    });
    var forms = [deps.map(function(c) { return 'DEP-' + c; }).join('+'), deps.map(function(c) { return 'DEP-' + c; }).join('%2B')];
    var lastErr = null;
    for (var i = 0; i < forms.length; i++) {
      try {
        var o = await get(ds, 'GEO=' + forms[i], filt);
        var nb = Array.from(new Set(o.map(depCode).filter(Boolean))).length;
        if (nb >= 20) return o;
        lastErr = 'seulement ' + nb + ' département(s) renvoyé(s)';
      } catch (e) { lastErr = e.message; }
    }
    addLog('⚠️', 'INSEE (' + ds + ') : comparatif départemental indisponible (' + lastErr + ') — valeur Aude seule.');
    return null;
  }
  function put(id, label, unit, fmtName, aude, period, desc, themes, snap) {
    var existing = INSEE_META.find(function(m) { return m.id === id; });
    var e = existing || { id: id, label: label, unit: unit, fmt: fmtName, themes: themes,
      occ: null, fra: null, rank_fr: null, rank_strate: null, rank_occ: null,
      total_fr: 96, total_strate: 11, total_occ: 13, stats_fr: {}, stats_strate: {}, stats_occ: {}, has_ts: false, desc: desc };
    e.aude = aude; e.annee = period; e.source = 'INSEE — API Melodi (direct)'; e.isNew = !existing;
    if (!existing) INSEE_META.push(e);
    var txt = '';
    if (snap && Object.keys(snap).length >= 20) {
      DREES_SNAP[id] = snap;
      var fr = statsAndRankFor(snap, null), st = statsAndRankFor(snap, STRATE), oc = statsAndRankFor(snap, OCC);
      e.stats_fr = fr.stats; e.rank_fr = fr.rank; e.total_fr = fr.total; e.fra = fr.stats.mean;
      e.stats_strate = st.stats; e.rank_strate = st.rank; e.total_strate = st.total;
      e.stats_occ = oc.stats; e.rank_occ = oc.rank; e.total_occ = oc.total; e.occ = oc.stats.mean;
      txt = ' — comparatif sur ' + fr.total + ' départements (moy. ' + fr.stats.mean.toFixed(2) + ')';
    } else { DREES_SNAP[id] = { '11': aude }; }
    addLog('✅', 'INSEE : ' + label + ' = ' + (Math.round(aude * 100) / 100) + ' ' + unit + ' (' + period + ')' + txt, !existing);
  }

  // ---------- 1) Population par tranche d'âge (recensement) ----------
  try {
    var ds1 = 'DS_RP_POPULATION_PRINC';
    var obsA = await audeObs(ds1);
    var period = latestPeriod(obsA);
    var dimsInfo = Object.keys(obsA[0].dimensions || {}).map(function(k) { return k + '=' + Array.from(new Set(obsA.map(function(o) { return dim(o, k); }))).slice(0, 8).join('/'); });
    addLog('ℹ️', 'INSEE (' + ds1 + ') : ' + obsA.length + ' observations pour l\'Aude, dimensions → ' + dimsInfo.join(' ; '));
    var all = await allDeps(ds1, obsA, ['AGE']);
    var src = all || obsA;
    var pool = reduceTotals(src.filter(function(o) { return String(dim(o, 'TIME_PERIOD')) === period; }), ['AGE']);
    var perDep = {};
    pool.forEach(function(o) {
      var c = depCode(o), v = val(o); if (!c || v === null) return;
      (perDep[c] = perDep[c] || {})[dim(o, 'AGE')] = v;
    });
    var defs = [
      ['insee_pop',    'Population totale',            'hab.', 'int',  function(d) { return d._T; },                                      'Population du département (recensement, INSEE).', ['demographie']],
      ['insee_p65',    'Part des 65 ans et plus',      '%',    'pct1', function(d) { return d._T && d.Y_GE65 != null ? d.Y_GE65 / d._T * 100 : null; }, 'Part des 65 ans et plus dans la population (recensement INSEE).', ['demographie', 'ages']],
      ['insee_p80',    'Part des 80 ans et plus',      '%',    'pct1', function(d) { return d._T && d.Y_GE80 != null ? d.Y_GE80 / d._T * 100 : null; }, 'Part des 80 ans et plus dans la population (recensement INSEE).', ['demographie', 'ages']],
      ['insee_m20',    'Part des moins de 20 ans',     '%',    'pct1', function(d) { return d._T && d.Y_LT20 != null ? d.Y_LT20 / d._T * 100 : null; }, 'Part des moins de 20 ans dans la population (recensement INSEE).', ['demographie', 'ase']],
      ['insee_m15',    'Part des moins de 15 ans',     '%',    'pct1', function(d) { return d._T && d.Y_LT15 != null ? d.Y_LT15 / d._T * 100 : null; }, 'Part des moins de 15 ans dans la population (recensement INSEE).', ['demographie', 'ase']],
      ['insee_a2064',  'Part des 20-64 ans',           '%',    'pct1', function(d) { return d._T && d.Y20T64 != null ? d.Y20T64 / d._T * 100 : null; }, 'Part des 20-64 ans dans la population (recensement INSEE).', ['demographie']],
      ['insee_ivieil', 'Indice de vieillissement',     '',     'dec1', function(d) { return d.Y_GE65 != null && d.Y_LT20 ? d.Y_GE65 / d.Y_LT20 * 100 : null; }, 'Nombre de 65 ans et plus pour 100 jeunes de moins de 20 ans.', ['demographie', 'ages']]
    ];
    defs.forEach(function(df) {
      var snap = {};
      Object.keys(perDep).forEach(function(c) { var v = df[4](perDep[c]); if (v !== null && v !== undefined && !isNaN(v)) snap[c] = v; });
      if (snap['11'] === undefined) { addLog('⚠️', 'INSEE : ' + df[1] + ' non calculable (tranches d\'âge absentes).'); return; }
      put(df[0], df[1], df[2], df[3], snap['11'], period, df[5], df[6], snap);
    });
  } catch (e) {
    addLog('⚠️', 'INSEE (population par âge) : ' + e.message + '. Aucun chiffre affiché plutôt qu\'un chiffre non sourcé.');
  }

  // ---------- 2) Pauvreté et niveau de vie médian (Filosofi) ----------
  try {
    var ds2 = 'DS_FILOSOFI_CC';
    var obsF = await audeObs(ds2);
    var perF = latestPeriod(obsF);
    var measDim = null;
    Object.keys(obsF[0].dimensions || {}).forEach(function(k) {
      var vals = obsF.map(function(o) { return dim(o, k); });
      if (vals.indexOf('PR_MD60') >= 0 || vals.indexOf('MED_SL') >= 0) measDim = k;
    });
    var dimsF = Object.keys(obsF[0].dimensions || {}).map(function(k) { return k + '=' + Array.from(new Set(obsF.map(function(o) { return dim(o, k); }))).slice(0, 6).join('/'); });
    addLog('ℹ️', 'INSEE (' + ds2 + ') : ' + obsF.length + ' observations pour l\'Aude, dimensions → ' + dimsF.join(' ; '));
    if (!measDim) throw new Error('mesures PR_MD60 / MED_SL introuvables dans la réponse');
    var allF = await allDeps(ds2, obsF, [measDim]);
    var poolF = reduceTotals((allF || obsF).filter(function(o) { return String(dim(o, 'TIME_PERIOD')) === perF; }), [measDim]);
    var fdefs = [
      ['insee_pauv', 'PR_MD60', 'Taux de pauvreté (seuil à 60 %)', '%', 'pct1', 'Part de la population sous le seuil de pauvreté (60 % du niveau de vie médian) — Filosofi, INSEE.', ['demographie', 'social']],
      ['insee_nvmed', 'MED_SL', 'Niveau de vie médian', '€', 'eur0', 'Niveau de vie médian annuel par unité de consommation — Filosofi, INSEE.', ['demographie', 'social', 'financier']]
    ];
    fdefs.forEach(function(fd) {
      var snap = {};
      poolF.forEach(function(o) { if (dim(o, measDim) !== fd[1]) return; var c = depCode(o), v = val(o); if (c && v !== null) snap[c] = v; });
      if (snap['11'] === undefined) { addLog('⚠️', 'INSEE : ' + fd[2] + ' absent pour l\'Aude.'); return; }
      put(fd[0], fd[2], fd[3], fd[4], snap['11'], perF, fd[5], fd[6], snap);
    });
  } catch (e) {
    addLog('⚠️', 'INSEE (Filosofi) : ' + e.message + '.');
  }
}

// ============================================================
// DREES — connecteur générique (data.drees.solidarites-sante.gouv.fr)
// Plateforme Opendatasoft. Les jeux ISD sont en format LONG : une ligne par
// indicateur, avec un champ générique "value" et un libellé en clair
// ("libelle_indicateur"). On filtre donc les LIGNES par mots-clés/phrase sur
// ce libellé, plutôt que de chercher une colonne par indicateur.
// ============================================================
var DREES_BASE = 'https://data.drees.solidarites-sante.gouv.fr/api/explore/v2.1/catalog/datasets/';
var DREES_DATASETS = {
  depenses:   ['376_les-depenses-d-aide-sociale-departementale', 'bases-de-donnees-brutes-de-l-enquete-aide-sociale-volet-depenses'],
  financiers: ['619_indicateurs-financiers'],
  enfance:    ['596_enfance-et-jeunesse-en-danger']
};
var DREES_FIELD_CACHE = {};
var DREES_RESOLVED_ID = {};

function normFr(s) {
  return (s || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}
// Version "fusionnée" (accents + tout signe de ponctuation retirés) pour matcher des expressions
// exactes indépendamment des apostrophes/virgules/espaces multiples.
function fuseFr(s) { return normFr(s).replace(/[^a-z0-9]/g, ''); }

function extractDreesFields(data) {
  if (Array.isArray(data.fields)) return data.fields;
  if (data.dataset && Array.isArray(data.dataset.fields)) return data.dataset.fields;
  if (data.dataset_schema && Array.isArray(data.dataset_schema.fields)) return data.dataset_schema.fields;
  return [];
}
async function getDreesFields(dsKey) {
  if (DREES_FIELD_CACHE[dsKey]) return DREES_FIELD_CACHE[dsKey];
  var ids = DREES_DATASETS[dsKey];
  for (var i = 0; i < ids.length; i++) {
    try {
      var r = await fetch(DREES_BASE + ids[i]);
      if (!r.ok) continue;
      var raw = await r.json();
      var fields = extractDreesFields(raw);
      if (!fields.length) {
        addLog('⚠️', 'DREES (' + dsKey + '/' + ids[i] + ') : pas de table interrogeable (probablement disponible en téléchargement de fichier seulement).');
        continue;
      }
      addLog('ℹ️', 'DREES (' + dsKey + ') : ' + fields.length + ' champs via « ' + ids[i] + ' » → ' + fields.map(function(f){return f.name;}).join(', '));
      DREES_RESOLVED_ID[dsKey] = ids[i];
      DREES_FIELD_CACHE[dsKey] = fields;
      return fields;
    } catch (e) { /* essai suivant */ }
  }
  DREES_FIELD_CACHE[dsKey] = [];
  return [];
}
function findDreesDim(fields, kind) {
  if (kind === 'dept') {
    var exact = ['dep','departement','code_dep','code_departement','num_dep','codegeo','code_geo','dept','coddep'];
    var byName = fields.find(function(f) { return exact.indexOf(normFr(f.name)) >= 0; });
    if (byName) return byName.name;
    var cands = fields.filter(function(f) {
      var nm = normFr(f.name), lbl = normFr(f.label || '');
      var looksCode = nm.indexOf('dep') >= 0 || lbl.indexOf('departement') >= 0;
      var looksLabel = nm.indexOf('lib') >= 0 || lbl.indexOf('libelle') >= 0 || lbl.indexOf('nom') >= 0;
      return looksCode && !looksLabel;
    });
    return cands[0] ? cands[0].name : null;
  }
  var byName2 = fields.find(function(f) { return normFr(f.name) === 'annee'; });
  if (byName2) return byName2.name;
  var cands2 = fields.filter(function(f) { return normFr(f.label || f.name).indexOf('annee') >= 0; });
  return cands2[0] ? cands2[0].name : null;
}
function findDreesLabelField(fields) {
  var exact = ['libelle_indicateur', 'libelle_isd', 'indicateur', 'libelle'];
  var byName = fields.find(function(f) { return exact.indexOf(normFr(f.name)) >= 0; });
  return byName ? byName.name : null;
}
// Sélection d'une LIGNE par libellé EXACT (insensible à la casse, aux accents, à la ponctuation).
// Le jeu contient de nombreux libellés proches (« Part des AED dans l'ensemble des mesures d'ASE »
// vs « Taux de mesures d'ASE »…) : une correspondance par mots-clés donnait de mauvais indicateurs.
function dreesCandidates(rows, labelField, yearField, rule) {
  var target = fuseFr(rule.exact);
  return rows.filter(function(rec) { return fuseFr(rec[labelField] || '') === target; })
    .sort(function(a, b) { var ya = yearField ? (a[yearField] || 0) : 0, yb = yearField ? (b[yearField] || 0) : 0; return yb - ya; });
}

// Lit toutes les pages d'un jeu (100 lignes max par appel) — sans ça, seules 100 lignes
// arbitraires (souvent d'anciennes années) étaient vues pour l'Aude.
async function fetchDreesPages(dsKey, whereClause, maxPages) {
  var id = DREES_RESOLVED_ID[dsKey], all = [];
  for (var p = 0; p < (maxPages || 8); p++) {
    var url = DREES_BASE + id + '/records?where=' + encodeURIComponent(whereClause) + '&limit=100&offset=' + (p * 100);
    var r = await fetch(url);
    if (!r.ok) { if (p === 0) throw new Error('HTTP ' + r.status); break; }
    var data = await r.json();
    var res = data.results || [];
    all = all.concat(res);
    if (res.length < 100) break;
  }
  return all;
}

// Indicateurs = libellés officiels EXACTS relevés dans le journal (jeux 619 et 596). Métadonnées éditoriales uniquement :
// la valeur vient toujours de l'API.
var DREES_RULES = [
  { id:'ind41', ds:'financiers', exact:"Dépenses brutes de RSA par habitant", label:'Dépenses RSA / habitant', unit:'€', fmt:'eur0', themes:['social','financier'], desc:"Dépenses brutes de RSA rapportées à la population du département." },
  { id:'ind42', ds:'financiers', exact:"Dépenses brutes de RSA par bénéficiaire", label:'Dépenses RSA / bénéficiaire', unit:'€', fmt:'eur0', themes:['social','financier'], desc:"Dépenses brutes de RSA rapportées au nombre de bénéficiaires." },
  { id:'ind43', ds:'financiers', exact:"Dépenses brutes d'APA, par habitant", label:'Dépenses APA / habitant', unit:'€', fmt:'eur0', themes:['ages','financier'], desc:"Dépenses brutes d'APA rapportées à la population du département." },
  { id:'ind44', ds:'financiers', exact:"Dépenses brutes d'APA, par bénéficiaire", label:'Dépenses APA / bénéficiaire', unit:'€', fmt:'eur0', themes:['ages','financier'], desc:"Dépenses brutes d'APA rapportées au nombre de bénéficiaires." },
  { id:'ind46', ds:'financiers', exact:"Dépenses totales brutes d'aide sociale par habitant", label:'Dépenses totales aide sociale / habitant', unit:'€', fmt:'eur0', themes:['financier'], desc:"Dépenses totales brutes d'aide sociale départementale rapportées à la population." },
  { id:'ind45', ds:'financiers', exact:"Dépenses brutes de PCH et d'ACTP, par habitant", label:'Dépenses PCH-ACTP / habitant', unit:'€', fmt:'eur0', themes:['handicap','financier'], desc:"Dépenses brutes de PCH et d'ACTP rapportées à la population." },
  { id:'ind09', ds:'financiers', exact:"Dépenses brutes de PCH et d'ACTP, par bénéficiaire", label:'Dépenses PCH-ACTP / bénéficiaire', unit:'€', fmt:'eur0', themes:['handicap','financier'], desc:"Dépenses brutes de PCH et d'ACTP rapportées au nombre de bénéficiaires." },
  { id:'ind47', ds:'financiers', exact:"Dépenses brutes d'aide à l'accueil pour personnes handicapées par habitant", label:'Dépenses aide à l\'accueil PH / habitant', unit:'€', fmt:'eur0', themes:['handicap','financier'], desc:"Dépenses brutes d'aide à l'accueil des personnes handicapées rapportées à la population." },
  { id:'ind48', ds:'financiers', exact:"Dépenses brutes d'aide à l'accueil pour personnes handicapées par bénéficiaire", label:'Dépenses aide à l\'accueil PH / bénéficiaire', unit:'€', fmt:'eur0', themes:['handicap','financier'], desc:"Dépenses brutes d'aide à l'accueil des personnes handicapées rapportées au nombre de bénéficiaires." },
  { id:'ind49', ds:'financiers', exact:"Dépenses brutes de placement de l'ASE par habitant", label:'Dépenses placement ASE / habitant', unit:'€', fmt:'eur0', themes:['ase','financier'], desc:"Dépenses brutes de placement de l'ASE rapportées à la population." },
  { id:'ind50', ds:'financiers', exact:"Dépenses brutes de placement de l'ASE par bénéficiaire", label:'Dépenses placement ASE / bénéficiaire', unit:'€', fmt:'eur0', themes:['ase','financier'], desc:"Dépenses brutes de placement de l'ASE rapportées au nombre de bénéficiaires." },
  { id:'ind31', ds:'enfance', exact:"Taux de mesures d'ASE (mesures de placements et actions éducatives) en % des 0-20 ans", label:'Taux mesures ASE', scale:100, unit:'%', fmt:'pct1', themes:['ase'], desc:"Mesures d'aide sociale à l'enfance (placements + actions éducatives) rapportées à la population des 0-20 ans." },
  { id:'ind32', ds:'enfance', exact:"Taux d'actions éducatives (AED et AEMO) dans la population des 0-20 ans", label:'Taux actions éducatives ASE', scale:100, unit:'%', fmt:'pct1', themes:['ase'], desc:"Actions éducatives (AED + AEMO) rapportées à la population des 0-20 ans." },
  { id:'ind33', ds:'enfance', exact:"Taux de mesures de placement (enfants accueillis à l'ASE) dans la population des 0-20 ans", label:'Taux mesures accueil ASE', scale:100, unit:'%', fmt:'pct1', themes:['ase'], desc:"Mesures de placement (enfants accueillis à l'ASE) rapportées à la population des 0-20 ans." },
  { id:'ind34', ds:'enfance', exact:"Part des mineurs dont le juge est saisi", label:'Part mineurs saisine juge enfants', scale:100, unit:'%', fmt:'pct1', themes:['ase'], desc:"Part des mineurs dont le juge des enfants est saisi en assistance éducative." },
  { id:'ind35', ds:'enfance', exact:"Nombre de places en établissement d’aide sociale à l’enfance pour 1 000 jeunes de 0 à 20 ans", label:"Places en établissement ASE / 1 000 jeunes", unit:'‰', fmt:'dec1', themes:['ase'], desc:"Places en établissement d'aide sociale à l'enfance pour 1 000 jeunes de 0 à 20 ans." }
];

// Calcule n / moyenne / médiane / quartiles sur un tableau de valeurs numériques.
// Fonction générique, réutilisée par le connecteur DREES ET le connecteur CAF.
function computeStats(vals) {
  if (!vals.length) return { n: 0 };
  var s = vals.slice().sort(function(a, b) { return a - b; });
  var n = s.length;
  function q(p) { var pos = (n - 1) * p, b = Math.floor(pos), r = pos - b; return s[b + 1] !== undefined ? s[b] + r * (s[b + 1] - s[b]) : s[b]; }
  return { n: n, mean: s.reduce(function(a, b) { return a + b; }, 0) / n, median: q(0.5), q1: q(0.25), q3: q(0.75) };
}
// Classe les départements d'un snap {dept: valeur} (rang 1 = valeur la plus haute), filtré
// optionnellement sur une liste de codes (Occitanie / Strate), et calcule les stats associées.
function statsAndRankFor(snapMap, deptFilter) {
  var entries = Object.keys(snapMap)
    .filter(function(d) { return !deptFilter || deptFilter.indexOf(d) >= 0; })
    .map(function(d) { return { dept: d, val: snapMap[d] }; })
    .filter(function(e) { return typeof e.val === 'number' && !isNaN(e.val); });
  if (!entries.length) return { stats: { n: 0 }, rank: null, total: 0 };
  var sorted = entries.slice().sort(function(a, b) { return b.val - a.val; });
  var rank = null;
  sorted.forEach(function(e, i) { if (e.dept === '11') rank = i + 1; });
  return { stats: computeStats(entries.map(function(e) { return e.val; })), rank: rank, total: entries.length };
}

async function loadDREES() {
  addLog('⏳', 'DREES : détection des champs de l\'API sur data.drees...');
  var dsUsed = {};
  DREES_RULES.forEach(function(r) { dsUsed[r.ds] = true; });

  var rowsByDs = {}, labelFieldByDs = {}, yearFieldByDs = {}, deptFieldByDs = {};
  for (var dsKey in dsUsed) {
    try {
      var fields = await getDreesFields(dsKey);
      if (!fields.length) continue;
      var deptField = findDreesDim(fields, 'dept');
      var yearField = findDreesDim(fields, 'annee');
      var labelField = findDreesLabelField(fields);
      if (!deptField || !labelField) { addLog('⚠️', 'DREES (' + dsKey + ') : champ département ou libellé introuvable.'); continue; }
      var rows = await fetchDreesPages(dsKey, deptField + '="11"', 8);
      if (!rows.length) { addLog('⚠️', 'DREES (' + dsKey + ') : 0 ligne pour l\'Aude (champ « ' + deptField + ' »).'); continue; }
      rowsByDs[dsKey] = rows; labelFieldByDs[dsKey] = labelField; yearFieldByDs[dsKey] = yearField; deptFieldByDs[dsKey] = deptField;
      var yrs = yearField ? Array.from(new Set(rows.map(function(x){ return x[yearField]; }))).sort().join(', ') : '?';
      addLog('ℹ️', 'DREES (' + dsKey + ') : ' + rows.length + ' lignes lues pour l\'Aude (années : ' + yrs + ').');
    } catch (e) {
      addLog('❌', 'DREES (' + dsKey + ') : erreur de connexion — ' + e.message);
    }
  }

  // Valeur des autres départements pour un indicateur identifié (même code_isd + même année),
  // pour reconstituer moyenne/médiane/quartiles/rangs.
  async function fetchDreesComparatif(dsKey, deptField, codeIsd, yearField, annee, scale) {
    if (!codeIsd || !yearField || annee == null) return null;
    try {
      var rows = await fetchDreesPages(dsKey, 'code_isd="' + codeIsd + '" AND ' + yearField + '=' + annee, 3);
      var snapMap = {};
      rows.forEach(function(rr) {
        var dc = rr[deptField], v = rr.value;
        if (dc == null || v === null || v === undefined || v === '') return;
        snapMap[String(dc)] = (typeof v === 'string' ? parseFloat(v.replace(',', '.')) : v) * (scale || 1);
      });
      return snapMap;
    } catch (e) { return null; }
  }

  if (typeof DREES_META === 'undefined') window.DREES_META = [];
  var prevIds = DREES_META.map(function(m) { return m.id; });
  var updated = 0;

  for (var ri = 0; ri < DREES_RULES.length; ri++) {
    var rule = DREES_RULES[ri];
    var rows = rowsByDs[rule.ds], labelField = labelFieldByDs[rule.ds], yearField = yearFieldByDs[rule.ds], deptField = deptFieldByDs[rule.ds];
    if (!rows) continue;
    var cands = dreesCandidates(rows, labelField, yearField, rule);
    if (!cands.length) { addLog('⚠️', rule.id + ' : libellé « ' + rule.exact + ' » absent pour l\'Aude.'); continue; }
    var rec = cands[0];
    var sameYear = cands.filter(function(c) { return !yearField || c[yearField] === rec[yearField]; });
    var distinctVals = Array.from(new Set(sameYear.map(function(c) { return c.value; })));
    if (distinctVals.length > 1) {
      addLog('⚠️', rule.id + ' : ' + sameYear.length + ' lignes de même libellé et même année avec des valeurs différentes → ' +
        sameYear.map(function(c) { return '[' + c.code_isd + ' / ' + (c.source || 'source ?') + ' = ' + c.value + ']'; }).join(' ') + ' (première retenue).');
    }
    var val = rec.value;
    if (val === null || val === undefined || val === '') { addLog('⚠️', rule.id + ' : ligne trouvée mais valeur vide.'); continue; }
    var aude = (typeof val === 'string' ? parseFloat(val.replace(',', '.')) : val) * (rule.scale || 1);
    var annee = yearField ? rec[yearField] : null;
    var isNew = prevIds.indexOf(rule.id) < 0;
    var existing = DREES_META.find(function(m) { return m.id === rule.id; });
    var entry = existing || {
      id: rule.id, label: rule.label, unit: rule.unit, fmt: rule.fmt, themes: rule.themes,
      occ:null, fra:null, rank_fr:null, rank_strate:null, rank_occ:null,
      total_fr:96, total_strate:11, total_occ:13, stats_fr:{}, stats_strate:{}, stats_occ:{}, has_ts:false,
      desc: rule.desc
    };
    entry.aude = aude;
    entry.annee = annee;
    entry.source = 'DREES — data.drees (direct, indicateur: ' + rec[labelField] + ')';
    entry.isNew = isNew;
    if (!existing) DREES_META.push(entry);

    var codeIsd = rec.code_isd;
    var snapMap = codeIsd ? await fetchDreesComparatif(rule.ds, deptField, codeIsd, yearField, annee, rule.scale) : null;
    if (snapMap && Object.keys(snapMap).length > 1) {
      DREES_SNAP[rule.id] = snapMap;
      var frRes = statsAndRankFor(snapMap, null);
      var strRes = statsAndRankFor(snapMap, STRATE);
      var occRes = statsAndRankFor(snapMap, OCC);
      entry.stats_fr = frRes.stats; entry.rank_fr = frRes.rank; entry.total_fr = frRes.total; entry.fra = frRes.stats.mean;
      entry.stats_strate = strRes.stats; entry.rank_strate = strRes.rank; entry.total_strate = strRes.total;
      entry.stats_occ = occRes.stats; entry.rank_occ = occRes.rank; entry.total_occ = occRes.total; entry.occ = occRes.stats.mean;
      var allV = Object.keys(snapMap).map(function(k) { return snapMap[k]; }).filter(function(x) { return typeof x === 'number' && !isNaN(x); });
      var mx = Math.max.apply(null, allV), mn = Math.min.apply(null, allV);
      if (frRes.stats.median > 0 && mx > 20 * frRes.stats.median) {
        addLog('⚠️', rule.id + ' : échelles possiblement hétérogènes selon les départements (min ' + mn.toFixed(3) + ' / médiane ' + frRes.stats.median.toFixed(3) + ' / max ' + mx.toFixed(3) + ') — moyenne à interpréter avec prudence.');
      }
      addLog('✅', rule.id + ' (' + entry.label + ') : ' + aude + ' ' + (entry.unit || '') + ' — comparatif sur ' + frRes.total + ' départements (moy. ' + entry.fra.toFixed(2) + '), année ' + annee, isNew);
    } else {
      DREES_SNAP[rule.id] = { '11': aude };
      addLog('⚠️', rule.id + ' : valeur Aude récupérée (' + aude + ', ' + annee + ') mais comparatif national indisponible.');
    }
    updated++;
  }

  addLog(updated ? '✅' : '⚠️', 'DREES : ' + updated + '/' + DREES_RULES.length + ' indicateurs mis à jour en direct.');
}

window.onload = function() {
  rebuildAllMeta();
  buildDash();
};
</script>
