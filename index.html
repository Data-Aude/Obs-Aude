<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#edf2f7;color:#1a2845;font-size:13px;min-height:100vh}
/* NAV */
#nav{background:#1a4a6e;border-bottom:3px solid #ED7D31;padding:0 16px;display:flex;align-items:center;gap:0;height:54px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#nav .brand{color:#fff;font-weight:700;font-size:14px;white-space:nowrap;margin-right:20px}
#nav .subtitle{color:#b8d4e8;font-size:11px;margin-right:auto}
.nav-tab{background:none;border:none;color:#c0d8ee;padding:0 14px;height:54px;cursor:pointer;font-size:13px;font-family:inherit;border-bottom:3px solid transparent;transition:all .15s}
.nav-tab:hover{color:#fff;background:#ffffff18}
.nav-tab.on{color:#FFB347;border-bottom-color:#FFB347;font-weight:600}
#nav .reload-btn{background:#0d3352;color:#7fb3f5;border:1px solid #2a6090;border-radius:5px;padding:5px 12px;cursor:pointer;font-size:12px;font-family:inherit;margin-left:12px;white-space:nowrap;transition:background .15s}
#nav .reload-btn:hover{background:#2a6090}
#nav .lastupd{color:#90b8d8;font-size:10px;margin-left:8px;white-space:nowrap}
#nav .branding{color:#90b8d8;font-size:10px;margin-left:12px;white-space:nowrap}
/* SECTIONS */
.section{display:none;padding:16px;min-height:calc(100vh - 54px)}
.section.on{display:block}
/* DASHBOARD */
#dash .theme-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.theme-btn{background:#fff;border:1px solid #c5d8ea;color:#4a6a8a;padding:5px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.theme-btn:hover{background:#e8f2fa;color:#1a4a6e;border-color:#8ab0cc}
.theme-btn.on{background:#ED7D31;border-color:#ED7D31;color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(237,125,49,.3)}
.theme-section{margin-bottom:20px}
.theme-header{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:6px 12px;border-radius:4px;margin-bottom:10px;color:#fff}
.th-demographie{background:#1a5276}
.th-ages{background:#1a7a58}
.th-handicap{background:#6a3090}
.th-financier{background:#9a4a10}
.th-social{background:#1a5276}
.th-aude{background:#1a6060}
.th-ase{background:#c0570a}
.th-jeunesse{background:#c0570a}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:#fff;border:1px solid #d0e2f0;border-radius:8px;padding:12px;cursor:pointer;transition:all .15s;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card:hover{border-color:#ED7D31;transform:translateY(-2px);box-shadow:0 4px 12px rgba(237,125,49,.2)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-label{font-size:12px;color:#5a7a9a;flex:1;margin-right:8px;line-height:1.3}
.card-source{font-size:9px;color:#8aaBcc;white-space:nowrap}
.card-val{font-size:26px;font-weight:700;color:#1a2845;margin-bottom:4px}
.card-val span{font-size:13px;font-weight:400;color:#3a7abf;margin-left:4px}
.card-refs{display:flex;gap:10px;margin-bottom:8px;font-size:10px}
.card-ref-item{text-align:center}
.card-ref-val{color:#3a6a9a;font-weight:600}
.card-ref-lbl{color:#8aaabb;font-size:9px}
.card-ranks{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.rank-badge{font-size:10px;padding:2px 6px;border-radius:3px;background:#e8f0f8;border:1px solid #c0d8ec;color:#4a6a8a}
.rank-badge.good{background:#e8f8ee;border-color:#b0dcc0;color:#1a7a40}
.rank-badge.mid{background:#fffbe8;border-color:#ddd080;color:#8a7010}
.rank-badge.bad{background:#ffeaec;border-color:#e8b0b8;color:#c03040}
.card-stats{display:flex;gap:6px;font-size:9px;color:#8aaabb;flex-wrap:wrap;margin-top:4px}
.card-stat{background:#edf2f7;padding:2px 5px;border-radius:3px;white-space:nowrap}
.card-stat span{color:#3a7abf}
.card-new{position:absolute;top:6px;right:6px;background:#ED7D31;color:#fff;font-size:8px;padding:1px 4px;border-radius:2px;font-weight:700}
/* MODAL */
#modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#00000055;z-index:200;align-items:center;justify-content:center}
#modal-overlay.on{display:flex}
#modal{background:#fff;border:1px solid #c0d8ec;border-radius:12px;padding:24px;max-width:560px;width:95%;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 8px 32px rgba(0,0,0,.15)}
#modal h3{color:#1a2845;font-size:16px;margin-bottom:4px}
#modal .modal-meta{font-size:11px;color:#7a9aaa;margin-bottom:16px}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#8aaabb;font-size:20px;cursor:pointer}
.modal-close:hover{color:#1a2845}
.modal-section{margin-bottom:16px}
.modal-section h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#3a7abf;margin-bottom:8px}
.modal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modal-stat-box{background:#edf2f7;border-radius:6px;padding:8px;text-align:center}
.modal-stat-val{font-size:15px;font-weight:700;color:#1a2845}
.modal-stat-lbl{font-size:9px;color:#7a9aaa;margin-top:2px}
.modal-rank-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:4px;margin-bottom:4px;font-size:12px}
.modal-rank-row:nth-child(odd){background:#f4f8fc}
/* CLASSEMENT */
#classement .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
#classement .theme-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ind-select-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.copy-img-btn{border:1px solid #c0d8ec;background:#fff;color:#3a7abf;border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.copy-img-btn:hover{background:#eef5fb}
.rank-title{font-size:18px;font-weight:800;color:#1a2845;line-height:1.25}
.rank-sub{font-size:11px;color:#6a7a8a;margin-top:3px}
.ind-btn{text-align:left;white-space:normal;max-width:100%;background:#fff;border:1px solid #c0d8ec;color:#5a7a9a;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit;transition:all .15s}
.ind-btn:hover{background:#e8f2fa;border-color:#8ab0cc}
.ind-btn.on{background:#4472C4;border-color:#4472C4;color:#fff}
.dep-select{background:#fff;border:1px solid #c0d8ec;color:#1a2845;padding:5px 8px;border-radius:5px;font-size:12px;font-family:inherit;cursor:pointer}
#rank-table{width:100%;border-collapse:collapse;font-size:12px}
#rank-table th{background:#e8f0f8;color:#3a6a8a;padding:7px 8px;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid #b8d0e8}
#rank-table td{padding:6px 8px;border-bottom:1px solid #e8f0f8;vertical-align:middle;color:#1a2845}
#rank-table tr:hover td{background:#f0f6fc}
#rank-table tr.aude-row td{background:#fff4ec !important;color:#c0570a !important;font-weight:700}
#rank-table tr.sel-row td{background:#f0f6fc !important;border-left:3px solid #4472C4 !important}
.gauge{background:#dce8f4;border-radius:3px;height:8px;position:relative;min-width:60px}
.gauge-fill{background:#4472C4;border-radius:3px;height:100%;transition:width .3s}
.gauge-fill.aude{background:#ED7D31}
/* scope buttons - Classement */
.scope-btn{background:#fff;border:1.5px solid #b8d0e8;color:#3a6a8a;padding:6px 16px;border-radius:20px;cursor:pointer;font-size:12px;font-family:inherit;font-weight:500;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.scope-btn:hover{background:#e8f2fa;border-color:#5a9ac4;color:#1a4a6e}
.scope-btn.on{background:#1a4a6e;border-color:#1a4a6e;color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(26,74,110,.25)}

#evolution .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.legend-swatch{width:18px;height:14px;border-radius:2px;flex-shrink:0}
#tooltip{position:fixed;background:#1a2845;border:1px solid #3a6a8a;border-radius:6px;padding:8px 10px;font-size:11px;pointer-events:none;display:none;z-index:150;max-width:180px;color:#fff}
/* EXPORT */

.exp-theme-btn{background:#fff;border:1px solid #c0d8ec;color:#5a7a9a;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.06)}

.exp-options{background:#fff;border:1px solid #d0e2f0;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.07)}

.gen-pdf-btn{background:#ED7D31;color:#fff;border:none;border-radius:6px;padding:10px 24px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 2px 8px rgba(237,125,49,.3);transition:background .15s}

function nf(val, d) {

function fmt(val, format, unit) {

    case 'dec1':   return nf(val, 1) + (unit ? ' '+unit : '');
    case 'dec2':   return nf(val, 2) + (unit ? ' '+unit : '');
    case 'int':    return nf(val, 0) + (unit ? ' '+unit : '');
    case 'eur0':   return nf(val, 0) + ' €';
    case 'keur':   return nf(val/1000, 1) + ' M€';
    default:       return val.toLocaleString('fr-FR', { maximumFractionDigits: 2 }).replace(/[\u202f\u00a0]/g, '\u00a0') + (unit ? ' '+unit : '');
  }
}

function fmtShort(val, format) {

  switch(format) {
    case 'pct1':   return nf(val, 1);
    case 'dec1':   return nf(val, 1);
    case 'dec2':   return nf(val, 2);
    case 'int':    return nf(val, 0);
    case 'eur0':   return nf(val, 0);
    case 'keur':   return nf(val/1000, 1) + ' M€';
    default:       return nf(val, 2);
  }

}

var HIDDEN_METAS = [];
var ZERO_METAS = []; // indicateurs retirés automatiquement car la valeur de l'Aude est 0
function isZeroAude(m) { return typeof m.aude === 'number' && Math.abs(m.aude) < 1e-12; }
function isHiddenInd(id) { return HIDDEN_INDICATORS.indexOf(id) >= 0 || HIDDEN_LOCAL.indexOf(id) >= 0; }
function saveHidden() { try { localStorage.setItem('obs_aude_hidden', JSON.stringify(HIDDEN_LOCAL)); } catch (eLs) {} }
function refreshAllViews() {
  rebuildAllMeta();
  if (typeof buildDash === 'function') buildDash();
  if (typeof renderRankIndBar === 'function') renderRankIndBar();
  if (typeof renderRankTable === 'function') renderRankTable();
  if (typeof renderEvoIndBar === 'function') renderEvoIndBar();
  if (typeof drawEvoChart === 'function') drawEvoChart();
  if (typeof renderCarteIndBar === 'function') renderCarteIndBar();
  if (typeof colorMap === 'function') colorMap();
  var ex = document.getElementById('export');
  if (typeof buildExport === 'function' && ex && ex.innerHTML) buildExport();
}
function hideInd(id) {
  if (HIDDEN_LOCAL.indexOf(id) < 0) HIDDEN_LOCAL.push(id);
  saveHidden();
  document.getElementById('modal-overlay').classList.remove('on');
  refreshAllViews();
}
function unhideInd(id) {
  HIDDEN_LOCAL = HIDDEN_LOCAL.filter(function(x) { return x !== id; });
  saveHidden();
  refreshAllViews();
  openHiddenPanel();
}
function unhideAll() { HIDDEN_LOCAL = []; saveHidden(); refreshAllViews(); document.getElementById('modal-overlay').classList.remove('on'); }
function copyHiddenIds() {
  var txt = JSON.stringify(HIDDEN_LOCAL);
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function() { alert('Liste copiée. Collez-la dans HIDDEN_INDICATORS (dans le code) pour la rendre permanente :\n' + txt); });
  else prompt('Copiez cette liste :', txt);

function openHiddenPanel() {
  var h = '<h3>Indicateurs masqués</h3><div class="modal-meta">Ils n\'apparaissent plus dans le tableau de bord, les classements, la carte, l\'évolution ni le PDF.</div>';

function rebuildAllMeta() {
  ALL_META = [];
  
  if (typeof DREES_META !== 'undefined') DREES_META.forEach(function(m) { ALL_META.push(m); });
  
  if (typeof INSEE_META !== 'undefined') {
    INSEE_META.forEach(function(m) {
      var full = Object.assign({rank_fr:null,rank_strate:null,rank_occ:null,total_fr:96,total_strate:11,total_occ:13,stats_fr:{},stats_strate:{},stats_occ:{},has_ts:false}, m);
      ALL_META.push(full);
      if (typeof INSEE_SNAP !== 'undefined' && INSEE_SNAP && INSEE_SNAP[m.id]) {
        if (typeof DREES_SNAP !== 'undefined') {
          if (!DREES_SNAP[m.id]) DREES_SNAP[m.id] = {};
          Object.assign(DREES_SNAP[m.id], INSEE_SNAP[m.id]);
        }
      }
    });
  }

  if (typeof CAF_META !== 'undefined') CAF_META.forEach(function(m) { ALL_META.push(m); });
  if (typeof AUDE_META !== 'undefined') AUDE_META.forEach(function(m) { ALL_META.push(m); });
  if (typeof CNSA_META !== 'undefined') CNSA_META.forEach(function(m) { ALL_META.push(m); });
  
  // Retrait des indicateurs masqués
  HIDDEN_METAS = ALL_META.filter(function(m) { return isHiddenInd(m.id); });
  if (HIDDEN_METAS.length) ALL_META = ALL_META.filter(function(m) { return !isHiddenInd(m.id); });
  ZERO_METAS = ALL_META.filter(isZeroAude);
  if (ZERO_METAS.length) ALL_META = ALL_META.filter(function(m) { return !isZeroAude(m); });
  ALL_META.forEach(normalizeMeta);
  var hb = document.getElementById('hidden-btn'); if (hb) hb.textContent = '🚫 Masqués (' + HIDDEN_METAS.length + ')';

  if (typeof DREES_SNAP !== 'undefined') {
    ALL_META.forEach(function(m) {
      if (DREES_SNAP[m.id] && Object.keys(DREES_SNAP[m.id]).length >= 10) MAP_CARTEABLE[m.id] = true;
    });
  }
}

function buildDash() {
  var container = document.getElementById('dash');
  
  var html = '<div class="theme-bar">';
  THEMES.forEach(function(th) {
    html += '<button class="theme-btn'+(th.id===currentThemeDash?' on':'')+'" data-theme-id="'+th.id+'" onclick="setThemeDash(this.dataset.themeId)">' + th.lbl + '</button>';
  });
  html += '<button class="theme-btn" id="hidden-btn" style="margin-left:auto" onclick="openHiddenPanel()">🚫 Masqués (' + HIDDEN_METAS.length + ')</button>';
  html += '</div>';
  html += '<div id="dash-cards"></div>';
  container.innerHTML = html;
  renderDashCards();
}

function setThemeDash(thId) {
  currentThemeDash = thId;
  document.querySelectorAll('#dash .theme-btn').forEach(function(b){
    b.classList.toggle('on', b.dataset.themeId === thId);
  });
  renderDashCards();
}

function renderDashCards() {
  function matchesTheme(m, thId) {
    if (!m.themes) return false;
    if (thId === 'ase') return m.themes.indexOf('ase') >= 0 || m.themes.indexOf('jeunesse') >= 0;
    return m.themes.indexOf(thId) >= 0;
  }
  var filtered = currentThemeDash === 'all' ? ALL_META : ALL_META.filter(function(m){ return matchesTheme(m, currentThemeDash); });
  
  var byTheme = {};
  filtered.forEach(function(m) {
    var th;
    if (currentThemeDash !== 'all' && matchesTheme(m, currentThemeDash)) {
      th = currentThemeDash;
    } else {
      var t0 = (m.themes && m.themes[0]) || 'autre';
      th = t0 === 'jeunesse' ? 'ase' : t0;
    }
    if (!byTheme[th]) byTheme[th] = [];
    byTheme[th].push(m);
  });
  
  var themeOrder = ['demographie','ages','handicap','ase','jeunesse','pmi','financier','social','aude','autre'];
  var html = '';
  
  themeOrder.forEach(function(thId) {
    if (!byTheme[thId] || byTheme[thId].length === 0) return;
    var thInfo = THEMES.find(function(t){return t.id===thId;}) || {lbl:thId, cls:'th-social'};
    html += '<div class="theme-section">';
    html += '<div class="theme-header ' + (thInfo.cls||'th-social') + '">' + thInfo.lbl + '</div>';
    html += '<div class="cards-grid">';
    byTheme[thId].forEach(function(m) {
      html += buildCard(m);
    });
    html += '</div></div>';
  });
  
  if (!html) {
    if (!ALL_META.length) {
      html = '<div class="msg welcome"><div class="ico">📊</div><strong style="font-size:18px">Bienvenue sur l\'Observatoire social de l\'Aude</strong>' +
        '<p style="margin:10px 0 16px">Pour afficher les indicateurs, chargez les données officielles (INSEE, DREES, CAF, CNSA, Département). Cela prend quelques secondes.</p>' +
        '<button class="gen-pdf-btn" id="welcome-reload" onclick="reloadLive()">⚡ Recharger les données</button></div>';
    } else {
      html = '<div class="msg"><div class="ico">📊</div><strong>Aucun indicateur pour ce thème</strong><p>Choisissez un autre thème.</p></div>';
    }
  }
  document.getElementById('dash-cards').innerHTML = html;
}

// TOOLTIP
var _tipEl = null;
function _getTip() {
  if (!_tipEl) {
    _tipEl = document.createElement('div');
    _tipEl.className = 'card-tooltip';
    document.body.appendChild(_tipEl);
  }
  return _tipEl;
}
function showCardTip(e, card) {
  var tip = _getTip();
  var ttRaw = decodeURIComponent(card.dataset.tt || '');
  if (!ttRaw) return;
  tip.innerHTML = '<div style="font-size:11px;line-height:1.5">' + ttRaw + '</div>';
  tip.style.display = 'block';
  _positionTip(e);
}
function moveCardTip(e) {
  if (_tipEl && _tipEl.style.display === 'block') _positionTip(e);
}
function hideCardTip() {
  if (_tipEl) _tipEl.style.display = 'none';
}
function _positionTip(e) {
  var tip = _tipEl;
  var tw = tip.offsetWidth || 300, th = tip.offsetHeight || 200;
  var vw = window.innerWidth, vh = window.innerHeight;
  var x = e.clientX + 16, y = e.clientY - 20;
  if (x + tw > vw - 10) x = e.clientX - tw - 16;
  if (y + th > vh - 10) y = vh - th - 10;
  if (y < 10) y = 10;
  tip.style.left = x + 'px';
  tip.style.top  = y + 'px';
}

function buildCard(m) {
  var isNew = m.isNew ? '<div class="card-new">NOUVEAU</div>' : '';
  var srcBadge = '';
  if (m.source && m.source.indexOf('CAF') >= 0) srcBadge = '<span class="badge-caf">CAF</span>';
  else if (m.source && m.source.indexOf('Open Data Aude') >= 0) srcBadge = '<span class="badge-aude">AUDE</span>';
  else if (m.source && m.source.indexOf('CNSA') >= 0) srcBadge = '<span class="badge-cnsa">CNSA</span>';
  else if (m.source && m.source.indexOf('DREES') >= 0) srcBadge = '<span class="badge-drees">DREES</span>';
  else if (m.source && m.source.indexOf('INSEE') >= 0) srcBadge = '<span class="badge-insee">INSEE</span>';
  
  var valFmt = fmt(m.aude, m.fmt, m.unit);
  
  var ranksHtml = '';
  if (m.rank_strate && m.total_strate)
    ranksHtml += '<span class="rank-badge ' + rankClass(m.rank_strate, m.total_strate) + '">Strate ' + m.rank_strate + '/' + m.total_strate + '</span>';
  if (m.rank_occ && m.total_occ)
    ranksHtml += '<span class="rank-badge ' + rankClass(m.rank_occ, m.total_occ) + '">Occ ' + m.rank_occ + '/' + m.total_occ + '</span>';
  if (m.rank_fr && m.total_fr)
    ranksHtml += '<span class="rank-badge ' + rankClass(m.rank_fr, m.total_fr) + '">France métro. ' + m.rank_fr + '/' + m.total_fr + '</span>';
  
  // Construction du contenu de la bulle d'information (Tooltip)
  function ttStatsRow(label, valAude, s) {
    var u = m.unit ? ' '+m.unit : '';
    var valStr = (valAude !== undefined && valAude !== null) ? fmtShort(valAude, m.fmt) : '—';
    var meanStr = (s && s.mean !== undefined && s.mean !== null) ? fmtShort(s.mean, m.fmt) : '—';
    var medStr = (s && s.median !== undefined && s.median !== null) ? fmtShort(s.median, m.fmt) : '—';
    var q1Str = (s && s.q1 !== undefined && s.q1 !== null) ? fmtShort(s.q1, m.fmt) : '—';
    var q3Str = (s && s.q3 !== undefined && s.q3 !== null) ? fmtShort(s.q3, m.fmt) : '—';

    return '<tr>' +
      '<td style="color:#8ab;padding:2px 5px 2px 0;white-space:nowrap;font-size:10px;font-weight:600">'+label+'</td>' +
      '<td style="padding:2px 3px;text-align:right">'+meanStr+'</td>' +
      '<td style="padding:2px 3px;text-align:right;color:#ccd">'+medStr+'</td>' +
      '<td style="padding:2px 3px;text-align:right;color:#99b">'+q1Str+'</td>' +
      '<td style="padding:2px 3px;text-align:right;color:#99b">'+q3Str+'</td>' +
      '</tr>';
  }

  var ttHtml = '';
  // Titre & Valeur Aude
  ttHtml += '<div style="font-size:12.5px;font-weight:700;color:#fff;line-height:1.35;margin-bottom:6px">' + m.label + '</div>';
  if (m.aude !== undefined && m.aude !== null) {
    ttHtml += '<div style="font-size:16px;font-weight:800;color:#f4a44a;margin-bottom:4px">' +
      '📍 Aude (11) : ' + fmt(m.aude, m.fmt, m.unit) + (m.annee ? ' <span style="font-size:9px;font-weight:400;opacity:.7">('+m.annee+')</span>' : '') +
      '</div>';
    var rk = [];
    if (m.rank_strate && m.total_strate) rk.push('Strate <b>'+m.rank_strate+'/'+m.total_strate+'</b>');
    if (m.rank_occ && m.total_occ) rk.push('Occitanie <b>'+m.rank_occ+'/'+m.total_occ+'</b>');
    if (m.rank_fr && m.total_fr) rk.push('France <b>'+m.rank_fr+'/'+m.total_fr+'</b>');
    if (rk.length) ttHtml += '<div style="font-size:10px;color:#ccd;margin-bottom:5px">Rang (1 = valeur la plus haute) : '+rk.join(' · ')+'</div>';
  }
  
  // Description
  ttHtml += '<div style="color:#ccd;font-size:10px;line-height:1.4;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:5px"><b style="color:#8ab">Définition :</b> ' + defOf(m) + '</div>';
  
  // Tableau complet de statistiques comparatives dans l'info-bulle
  ttHtml += '<div style="font-size:9.5px;color:#8ab;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px">Comparatif Région & Strate</div>' +
    '<table style="width:100%;border-collapse:collapse;font-size:10px">' +
    '<thead><tr style="color:#8ab;font-size:9px;text-align:right">' +
      '<th style="text-align:left;padding-bottom:3px">Échelle</th>' +
      '<th style="padding:0 3px">Moy.</th>' +
      '<th style="padding:0 3px">Méd.</th>' +
      '<th style="padding:0 3px">Q1</th>' +
      '<th style="padding:0 3px">Q3</th>' +
    '</tr></thead><tbody>' +
    ttStatsRow('Strate ('+(m.total_strate||'?')+' dép.)', m.aude, m.stats_strate) +
    ttStatsRow('Occitanie ('+(m.total_occ||'?')+' dép.)', m.aude, m.stats_occ) +
    ttStatsRow('France métro. ('+(m.total_fr||'?')+' dép.)', m.aude, m.stats_fr) +
    '</tbody></table>' +
    '<div style="color:#7ab;font-size:8.5px;margin-top:4px;font-style:italic">Unité : '+(m.unit||'—')+'</div>';

  var audeValTxt = valFmt + (m.annee ? ' <span style="opacity:.6;font-size:10px">'+m.annee+'</span>' : '');
  
  return '<div class="card" data-ind-id="'+m.id+'"' +
    ' data-tt="'+encodeURIComponent(ttHtml)+'"' +
    ' data-aude-lbl="'+encodeURIComponent(m.label)+'"' +
    ' data-aude-val="'+encodeURIComponent(audeValTxt)+'"' +
    ' onmouseenter="showCardTip(event,this)" onmousemove="moveCardTip(event)" onmouseleave="hideCardTip()"' +
    ' onclick="openModal(this.dataset.indId)">' +
    isNew +
    '<div class="card-head"><div class="card-label">' + m.label + '</div><div>' + srcBadge + '</div></div>' +
    '<div class="card-val">' + valFmt + '<span>' + (m.annee || '') + '</span></div>' +
    (ranksHtml ? '<div class="card-ranks">' + ranksHtml + '</div>' : '') +
    '</div>';
}

// ===== Copie d'un graphique en image (presse-papiers, sinon téléchargement) =====
function escXml(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function wrapLines(text, maxChars) {
  var words = String(text || '').split(/\s+/), lines = [], cur = '';
  words.forEach(function(w) {
    if ((cur + ' ' + w).trim().length > maxChars && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim();
  });
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}
function flashBtn(btn, msg) {
  if (!btn) return;
  var old = btn.dataset.lbl || btn.innerHTML; btn.dataset.lbl = old;
  btn.innerHTML = msg;
  setTimeout(function() { btn.innerHTML = old; }, 2200);
}
function downloadBlob(blob, name) {
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function svgToPngBlob(svgStr, w, h) {
  return new Promise(function(resolve, reject) {
    var img = new Image();
    img.onload = function() {
      var k = 2, c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      var g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function(b) { b ? resolve(b) : reject(new Error('conversion impossible')); }, 'image/png');
    };
    img.onerror = function() { reject(new Error('image illisible')); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  });
}
// Doit être appelée directement depuis le clic (le presse-papiers exige un geste de l'utilisateur)
function copySvgAsImage(svgStr, w, h, btn, filename) {
  var blobP = svgToPngBlob(svgStr, w, h);
  if (navigator.clipboard && window.ClipboardItem) {
    try {
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blobP })]).then(function() { flashBtn(btn, '✓ Copié'); })
        .catch(function() { blobP.then(function(b) { downloadBlob(b, filename); flashBtn(btn, '⬇ Téléchargé'); }); });
      return;
    } catch (e) { /* repli : téléchargement */ }
  }
  blobP.then(function(b) { downloadBlob(b, filename); flashBtn(btn, '⬇ Téléchargé'); }).catch(function() { flashBtn(btn, '✗ Échec'); });
}
function exportFooter(W, y, source) {
  return '<text x="14" y="' + y + '" font-size="9" fill="#8a97a6">' + escXml(source ? 'Source : ' + source : '') + '</text>' +
    '<text x="' + (W - 14) + '" y="' + y + '" font-size="9" fill="#8a97a6" text-anchor="end">Fait par le Contrôle de Gestion avec ❤️ et un peu d\'IA</text>';
}
var lastRankExport = null, lastEvoExport = null;

// Image du classement : titre + barres horizontales (même ordre que le tableau)
function buildRankSvg(x) {
  var m = x.m, items = x.items, W = 760, rowH = 17, nameX = 44, barX = 250, barMax = 400;
  var tl = wrapLines(m.label, 62), headH = 16 + tl.length * 24 + 34;
  var vals = items.map(function(i) { return i.val; }), mx = Math.max.apply(null, vals), mn = Math.min(0, Math.min.apply(null, vals));
  var span = (mx - mn) || 1, zeroX = barX + (0 - mn) / span * barMax;
  var H = headH + items.length * rowH + 40;
  var out = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" font-family="Arial, Helvetica, sans-serif"><rect width="' + W + '" height="' + H + '" fill="#fff"/>';
  tl.forEach(function(ln, i) { out += '<text x="14" y="' + (28 + i * 24) + '" font-size="20" font-weight="700" fill="#1a2845">' + escXml(ln) + '</text>'; });
  out += '<text x="14" y="' + (28 + (tl.length - 1) * 24 + 20) + '" font-size="11" fill="#6a7a8a">' + escXml(x.sub) + '</text>';
  items.forEach(function(it, i) {
    var y = headH + i * rowH, isA = it.code === '11', isS = x.selDept && it.code === x.selDept;
    if (isA) out += '<rect x="6" y="' + y + '" width="' + (W - 12) + '" height="' + rowH + '" fill="#fff1e6"/>';
    else if (isS) out += '<rect x="6" y="' + y + '" width="' + (W - 12) + '" height="' + rowH + '" fill="#f1e8fc"/>';
    var bw = Math.max(1, Math.abs(it.val - 0) / span * barMax), bx = it.val >= 0 ? zeroX : zeroX - bw;
    out += '<text x="34" y="' + (y + 12) + '" font-size="10" fill="#8a97a6" text-anchor="end">' + (i + 1) + '</text>' +
      '<text x="' + nameX + '" y="' + (y + 12) + '" font-size="11" fill="#1a2845"' + (isA ? ' font-weight="700"' : '') + '>' + escXml(it.code + ' ' + it.name) + '</text>' +
      '<rect x="' + bx.toFixed(1) + '" y="' + (y + 3) + '" width="' + bw.toFixed(1) + '" height="' + (rowH - 6) + '" rx="2" fill="' + (isA ? '#ED7D31' : (isS ? '#7a4ad0' : '#8fb0d8')) + '"/>' +
      '<text x="' + (bx + bw + 6).toFixed(1) + '" y="' + (y + 12) + '" font-size="10" fill="#1a2845"' + (isA ? ' font-weight="700"' : '') + '>' + escXml(fmt(it.val, m.fmt, m.unit)) + '</text>';
  });
  out += exportFooter(W, H - 12, x.source) + '</svg>';
  return { svg: out, W: W, H: H };
}
function copyRankImage(btn) {
  if (!lastRankExport) return;
  var r = buildRankSvg(lastRankExport), nm = String(lastRankExport.m.label).replace(/[^a-z0-9]+/gi, '_').slice(0, 50);

// Image de l'évolution : le graphique affiché (titre inclus) + légende
function copyEvoImage(btn) {
  if (!lastEvoExport) return;
  var e = lastEvoExport, legH = 30, H = e.H + legH + 22, out = '<svg xmlns="http://www.w3.org/2000/svg" width="' + e.W + '" height="' + H + '" viewBox="0 0 ' + e.W + ' ' + H + '" font-family="Arial, Helvetica, sans-serif"><rect width="' + e.W + '" height="' + H + '" fill="#fff"/>' + e.inner;
  var lx = 70;
  e.legend.forEach(function(it) {
    out += '<line x1="' + lx + '" y1="' + (e.H + 14) + '" x2="' + (lx + 18) + '" y2="' + (e.H + 14) + '" stroke="' + it.col + '" stroke-width="' + (it.dashed ? 2 : 3) + '"' + (it.dashed ? ' stroke-dasharray="5,3"' : '') + '/>' +
      '<text x="' + (lx + 24) + '" y="' + (e.H + 18) + '" font-size="11" fill="#333">' + escXml(it.label) + '</text>';
    lx += 34 + it.label.length * 6.2;
  });
  out += exportFooter(e.W, H - 8, e.source) + '</svg>';
  var nm = String(e.title).replace(/[^a-z0-9]+/gi, '_').slice(0, 50);

  var cb = document.getElementById('evo-copy-btn'); if (cb) cb.style.display = 'none';
  lastEvoExport = null;
  if (svg) svg.setAttribute('viewBox', '0 0 700 300');
  if (!svg || !currentIndEvo) return;
  var m = ALL_META.find(function(x){return x.id===currentIndEvo;});
  if (!m) return;
  
  if (!DREES_TS[currentIndEvo]) {
    var rankHtml = '';
    if (m.rank_fr) rankHtml += '<span class="rank-badge '+rankClass(m.rank_fr,m.total_fr)+'">France métro. '+m.rank_fr+'/'+m.total_fr+'</span> ';
    if (m.rank_occ) rankHtml += '<span class="rank-badge '+rankClass(m.rank_occ,m.total_occ)+'">Occitanie '+m.rank_occ+'/'+m.total_occ+'</span> ';
    if (m.rank_strate) rankHtml += '<span class="rank-badge '+rankClass(m.rank_strate,m.total_strate)+'">Strate '+m.rank_strate+'/'+m.total_strate+'</span>';
    svg.innerHTML = '';
    if (legend) legend.innerHTML = '<div style="padding:16px;background:#f4f5f7;border-radius:8px;font-size:12px;color:#595959;line-height:1.8">' +
      '<div style="font-size:20px;font-weight:800;color:#ED7D31;margin-bottom:4px">'+fmt(m.aude,m.fmt,m.unit)+'</div>' +
      '<div style="font-size:13px;color:#1a1a2e;font-weight:600;margin-bottom:6px">'+m.label+' — Aude (11)</div>' +
      '<div style="margin-bottom:6px">'+rankHtml+'</div>' +
      '<div style="color:#888;font-size:11px;font-style:italic">Série temporelle non disponible pour cet indicateur. Millésime '+m.annee+'.</div>' +
      '</div>';
    return;
  }
  
  var ts = DREES_TS[currentIndEvo];
  var audeTs = ts['11'] || {};
  var years = Object.keys(audeTs).sort();
  // On préfère afficher toutes les années depuis 2020 (plus lisible qu'un ou deux
  // millésimes isolés) ; si moins de 2 points existent depuis 2020, on garde tout l'historique.
  var recentYears = years.filter(function(y){ return parseInt(y, 10) >= 2020; });
  if (recentYears.length >= 2) years = recentYears;
  if (!years.length) return;
  
  var occTs = {};
  if (ts['OCC']) {
    occTs = ts['OCC'];
  } else {
    years.forEach(function(y) {
      var vals = OCC.map(function(c){return ts[c] && ts[c][y];}).filter(function(v){return v !== null && v !== undefined;});
      if (vals.length) occTs[y] = vals.reduce(function(a,b){return a+b;},0) / vals.length;
    });
  }
  
  var strTs = ts['STR'] || null;
  if (strTs) { var sv = years.map(function(y) { return strTs[y]; }).filter(function(v) { return typeof v === 'number'; }), av = years.map(function(y) { return audeTs[y]; }); var am = av.reduce(function(a, b) { return a + b; }, 0) / av.length; if (!sv.length || (am && (sv.reduce(function(a, b) { return a + b; }, 0) / sv.length) / am > 50)) strTs = null; }
  var compTs = selectedDeptEvo && ts[selectedDeptEvo] ? ts[selectedDeptEvo] : null;
  if (!compTs && selectedDeptEvo) {
    var compSnap = getSnap(currentIndEvo);
    if (compSnap && compSnap[selectedDeptEvo] !== undefined) {
      var lastYear = years[years.length-1];
      compTs = {}; compTs[lastYear] = compSnap[selectedDeptEvo];
    }
  }
  
  var W = 700, H = 300, PL = 70, PR = 20, PT = 20, PB = 40;
  var cW = W - PL - PR, cH = H - PT - PB;
  
  var allVals = years.map(function(y){return audeTs[y];});
  years.forEach(function(y){if(occTs[y]) allVals.push(occTs[y]);});
  if (strTs) years.forEach(function(y){if(typeof strTs[y] === 'number') allVals.push(strTs[y]);});
  if (compTs) years.forEach(function(y){if(compTs[y]) allVals.push(compTs[y]);});
  
  var minV = Math.min.apply(null, allVals) * 0.95;
  var maxV = Math.max.apply(null, allVals) * 1.05;
  
  var yr0 = parseInt(years[0]), yr1 = parseInt(years[years.length-1]);
  function xPos(y) { return yr1 === yr0 ? PL + cW/2 : PL + (y - yr0) / (yr1 - yr0) * cW; }
  function yPos(v) { return (maxV === minV) ? PT + cH/2 : PT + cH - (v - minV) / (maxV - minV) * cH; }
  
  function makePath(tsData, color, dashed) {
    var pts = years.filter(function(y){return tsData[y]!==undefined && tsData[y]!==null;});
    if (!pts.length) return '';
    var d = pts.map(function(y,i){
      return (i===0?'M':'L') + xPos(parseInt(y)).toFixed(1) + ',' + yPos(tsData[y]).toFixed(1);
    }).join(' ');
    return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="'+(dashed?1.5:2.5)+'" '+(dashed?'stroke-dasharray="5,3"':'')+' />';
  }
  
  var svgHtml = '';
  var yTicks = 5;
  for (var i = 0; i <= yTicks; i++) {
    var yVal = minV + (maxV - minV) * i / yTicks;
    var y = yPos(yVal);
    svgHtml += '<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="#dde1e7" stroke-width="1" />';
    svgHtml += '<text x="'+(PL-5)+'" y="'+(y+4).toFixed(1)+'" fill="#888" font-size="9" text-anchor="end">'+fmtShort(yVal, m.fmt)+'</text>';
  }
  
  var step = years.length > 20 ? 5 : years.length > 10 ? 2 : 1;
  years.forEach(function(y, i) {
    if (i % step !== 0) return;
    var x = xPos(parseInt(y));
    svgHtml += '<text x="'+x.toFixed(1)+'" y="'+(H-PB+15)+'" fill="#888" font-size="9" text-anchor="middle">'+y+'</text>';
  });
  
  var fraTs = ts['FRA'] || {};
  var fraVals = Object.values(fraTs).filter(function(v){return v!=null;});
  var audeVals2 = Object.values(audeTs).filter(function(v){return v!=null;});
  var fraAvg = fraVals.length ? fraVals.reduce(function(a,b){return a+b;},0)/fraVals.length : 0;
  var audeAvg = audeVals2.length ? audeVals2.reduce(function(a,b){return a+b;},0)/audeVals2.length : 1;
  var fraHasData = fraVals.length > 0 && fraAvg / audeAvg < 50; 
  
  if (fraHasData) allVals = allVals.concat(fraVals);
  
  svgHtml += makePath(occTs, '#2E7D32', true);
  if (strTs) svgHtml += makePath(strTs, '#B8860B', true);
  if (fraHasData) svgHtml += makePath(fraTs, '#4472C4', true);
  if (compTs) svgHtml += makePath(compTs, '#bb80f0', true);
  svgHtml += makePath(audeTs, '#ED7D31', false);
  
  var lastY = years[years.length - 1];
  if (audeTs[lastY] !== undefined) {
    var lx = xPos(parseInt(lastY)), ly = yPos(audeTs[lastY]);
    svgHtml += '<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="4" fill="#ED7D31" />';
  }
  
  // Titre de l'indicateur EN GRAND dans le graphique (il fait partie de l'image copiée)
  var tl = wrapLines(m.label, 56), hdr = 12 + tl.length * 24 + 24, srcShort = m.source ? String(m.source).split(' (')[0] : '';
  var evoSub = 'Évolution de l\'Aude (11)' + (m.unit && m.fmt !== 'pct1' && m.fmt !== 'eur0' ? ' · unité : ' + m.unit : '') + (srcShort ? ' · ' + srcShort : '');
  var headSvg = tl.map(function(ln, i) { return '<text x="14" y="' + (28 + i * 24) + '" font-size="20" font-weight="800" fill="#1a2845">' + escXml(ln) + '</text>'; }).join('') +
    '<text x="14" y="' + (28 + (tl.length - 1) * 24 + 19) + '" font-size="11" fill="#6a7a8a">' + escXml(evoSub) + '</text>';
  svg.setAttribute('viewBox', '0 0 700 ' + (300 + hdr));
  svg.innerHTML = headSvg + '<g transform="translate(0,' + hdr + ')">' + svgHtml + '</g>';
  var legItems = [{ col: '#ED7D31', label: 'Aude (11)', dashed: false }, { col: '#2E7D32', label: 'Moy. Occitanie', dashed: true }];
  if (strTs) legItems.push({ col: '#B8860B', label: 'Moy. strate', dashed: true });
  legItems.push({ col: '#4472C4', label: 'France métro.', dashed: true });
  if (selectedDeptEvo) legItems.push({ col: '#bb80f0', label: DEPTS[selectedDeptEvo] || selectedDeptEvo, dashed: true });
  lastEvoExport = { W: 700, H: 300 + hdr, inner: svg.innerHTML, legend: legItems, title: m.label, source: m.source || '' };
  if (cb) cb.style.display = '';
  
  var legHtml = '<div class="evo-legend-item"><div class="evo-legend-dot" style="background:#ED7D31"></div>Aude (11)</div>';
  legHtml += '<div class="evo-legend-item"><div class="evo-legend-dot" style="background:#2E7D32;opacity:.7;border:1px dashed #2E7D32"></div>Moy. Occitanie</div>';
  if (strTs) legHtml += '<div class="evo-legend-item"><div class="evo-legend-dot" style="background:#B8860B;opacity:.7;border:1px dashed #B8860B"></div>Moy. strate</div>';
  legHtml += '<div class="evo-legend-item"><div class="evo-legend-dot" style="background:#4472C4;opacity:.7;border:1px dashed #4472C4"></div>France métro.</div>';
  if (selectedDeptEvo) legHtml += '<div class="evo-legend-item"><div class="evo-legend-dot" style="background:#bb80f0"></div>' + (DEPTS[selectedDeptEvo]||selectedDeptEvo) + '</div>';
  legend.innerHTML = legHtml;
}

var geoLoadPromise = null;
// Récupère (et met en cache) le fond de carte GeoJSON, indépendamment de la carte interactive
// affichée à l'écran — sert aussi à la mini-cartographie de chaque fiche du rapport PDF.
function ensureGeo() {
  if (geoCache) return Promise.resolve(geoCache);
  if (geoLoadPromise) return geoLoadPromise;
  geoLoadPromise = fetch('https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-version-simplifiee.geojson')
    .then(function(r){ return r.json(); })
    .then(function(geo) { geoCache = geo; return geo; });
  return geoLoadPromise;
}

function loadGeo() {
  ensureGeo().then(function(geo) {
    mapBuilt = true;
    buildSVGMap(geo);
    colorMap();
  }).catch(function() {
    var wrap = document.getElementById('map-svg-wrap');
    if (wrap) wrap.innerHTML = '<div class="msg"><div class="ico">🌐</div><strong>Carte indisponible</strong><p>Connexion internet requise.</p></div>';
  });
}

function buildSVGMap(geo) {
  var H=640, lonMin=-5.3,lonMax=9.8,latMin=41.2,latMax=51.2;
  var W=Math.round(H*(lonMax-lonMin)*Math.cos(46.2*Math.PI/180)/(latMax-latMin)); // proportions réelles (correction de la longitude à 46° N)
  function proj(lon,lat){ return [(lon-lonMin)/(lonMax-lonMin)*W, H-(lat-latMin)/(latMax-latMin)*H]; }
  function rings2path(rings) {
    return rings.map(function(ring){
      return ring.map(function(p,i){ var xy=proj(p[0],p[1]); return (i?'L':'M')+xy[0].toFixed(1)+','+xy[1].toFixed(1); }).join('')+' Z';
    }).join(' ');
  }
  var parts = ['<svg class="map-svg" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:100%;max-height:100%">'];
  geo.features.forEach(function(f){
    var raw=f.properties.code; if(!raw) return;
    var code=raw.length===1?'0'+raw:raw;
    var d='';
    if(f.geometry.type==='Polygon') d=rings2path(f.geometry.coordinates);
    else if(f.geometry.type==='MultiPolygon') d=f.geometry.coordinates.map(rings2path).join(' ');
    if(!d) return;
    parts.push('<path data-code="'+code+'" d="'+d+'" fill="#2a3560"'+(code==='11'?' class="hl"':'')+' />');
  });
  parts.push('</svg>');
  var wrap = document.getElementById('map-svg-wrap');
  if (wrap) {
    wrap.innerHTML = parts.join('');
    var tt = document.getElementById('tooltip');
    wrap.querySelectorAll('path[data-code]').forEach(function(path){
      path.addEventListener('mousemove', function(e){
        var code=path.dataset.code;
        if (!currentIndCarte || !DREES_SNAP[currentIndCarte]) return;
        var val=DREES_SNAP[currentIndCarte][code];
        var m=ALL_META.find(function(x){return x.id===currentIndCarte;});
        tt.style.display='block';
        tt.style.left=(e.clientX+14)+'px';
        tt.style.top=(e.clientY-30)+'px';
        tt.innerHTML='<strong>'+(DEPTS[code]||code)+'</strong> ('+code+')<br>'+(m?fmt(val,m.fmt,m.unit):'—');
      });
      path.addEventListener('mouseleave', function(){tt.style.display='none';});
      path.addEventListener('click', function(){
        var code=path.dataset.code;
        var m=ALL_META.find(function(x){return x.id===currentIndCarte;});
        if(m) openModal(m.id);
      });
    });
  }
}

function colorMap() {
  if (!mapBuilt || !currentIndCarte) return;
  var snap = DREES_SNAP[currentIndCarte];
  var m = ALL_META.find(function(x){return x.id===currentIndCarte;});
  if (!snap || !m) return;
  var wrap = document.getElementById('map-svg-wrap');
  if (!wrap || !wrap.querySelector('svg')) return;

  var snapC = cleanDeptMap(snap);
  var vals = Object.keys(snapC).map(function(k){ return snapC[k]; }).filter(function(v){ return typeof v === 'number' && !isNaN(v); });
  if (vals.length < 2) {
    var legElNa = document.getElementById('legend-items');
    if (legElNa) legElNa.innerHTML = '<div style="color:#888;padding:4px 0">Comparaison départementale non disponible pour cet indicateur.</div>';
    return;
  }
  vals.sort(function(a,b){ return a-b; });

  // 5 classes en quintiles : plus le bleu est foncé, plus la valeur est élevée
  var palette = ['#e8f1fb','#b7d3ee','#79aede','#3b7fc4','#0f4c8a'];
  var breaks = [];
  for (var q = 1; q < 5; q++) breaks.push(vals[Math.min(vals.length - 1, Math.floor(vals.length * q / 5))]);
  function classOf(v) { var c = 0; while (c < breaks.length && v >= breaks[c]) c++; return c; }
  function getColor(v) { return (typeof v !== 'number' || isNaN(v)) ? '#e5e9f0' : palette[classOf(v)]; }

  var svg = wrap.querySelector('svg');
  svg.querySelectorAll('.aude-hl').forEach(function(n){ n.remove(); });
  var audePath = null;
  wrap.querySelectorAll('path[data-code]').forEach(function(path){
    var code = path.dataset.code;
    path.setAttribute('fill', getColor(snap[code]));
    path.setAttribute('stroke', '#ffffff');
    path.setAttribute('stroke-width', '0.6');
    if (code === '11') audePath = path;
  });

  // L'Aude ressort : liseré orange fin doublé d'un trait sombre très fin, tracé par-dessus les autres départements
  if (audePath) {
    var d = audePath.getAttribute('d'), NS = 'http://www.w3.org/2000/svg';
    [['#1a2845', 2.2], ['#ED7D31', 1.1]].forEach(function(st) {
      var ov = document.createElementNS(NS, 'path');
      ov.setAttribute('d', d); ov.setAttribute('class', 'aude-hl'); ov.setAttribute('fill', 'none');
      ov.style.setProperty('stroke', st[0], 'important'); ov.style.setProperty('stroke-width', String(st[1]), 'important'); ov.setAttribute('stroke-linejoin', 'round');
      ov.setAttribute('pointer-events', 'none');
      svg.appendChild(ov);
    });
  }

  var legEl = document.getElementById('legend-items');
  if (legEl) {
    var bounds = [vals[0]].concat(breaks).concat([vals[vals.length - 1]]);
    var legHtml = '<div style="font-weight:700;color:#1a2845;margin-bottom:6px;line-height:1.3">' + m.label + (m.unit ? ' <span style="font-weight:400">(' + m.unit + ')</span>' : '') + '</div>';
    for (var i = 4; i >= 0; i--) {
      legHtml += '<div class="legend-item"><div class="legend-swatch" style="background:' + palette[i] + '"></div><span>' + fmtShort(bounds[i], m.fmt) + ' – ' + fmtShort(bounds[i + 1], m.fmt) + '</span></div>';
    }
    legHtml += '<div class="legend-item"><div class="legend-swatch" style="background:#e5e9f0"></div><span>Pas de donnée</span></div>';
    legHtml += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid #d0e2f0;color:#1a2845"><span style="display:inline-block;width:14px;height:10px;border:2px solid #ED7D31;box-shadow:0 0 0 1px #1a2845;vertical-align:middle;margin-right:5px"></span><b>Aude</b> : ' + fmt(m.aude, m.fmt, m.unit) +
      (m.rank_fr ? '<br><span style="font-size:10px">France métro. — rang ' + m.rank_fr + '/' + m.total_fr + ' (1 = valeur la plus haute)</span>' : '') + '</div>';
    legHtml += '<div style="margin-top:6px;font-size:10px;color:#888">Plus la couleur est foncée, plus la valeur est élevée.</div>';
    legEl.innerHTML = legHtml;
  }
}

function gaugeSet(pct) {
  var g = document.getElementById('load-gauge');
  if (!g) return;
  if (pct <= 0) { g.style.opacity = '0'; g.style.width = '0%'; return; }
  g.style.opacity = '1';
  g.style.width = Math.min(100, pct) + '%';
  if (pct >= 100) {
    setTimeout(function() { g.style.opacity = '0'; }, 350);
    setTimeout(function() { g.style.width = '0%'; }, 750);
  }
}

async function reloadLive() {
  const btn = document.getElementById('reload-btn');
  const lastUpdEl = document.getElementById('lastupd');

  if (btn && btn.disabled) return;

  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Chargement...';
  }
  gaugeSet(6);

  try {
    if (typeof refreshLog !== 'undefined') refreshLog.length = 0;
    if (typeof newCount !== 'undefined') newCount = 0;

    if (typeof addLog === 'function') addLog('⏳', 'Rechargement des données démarré...', false);

    var totalSources = 5, doneSources = 0;
    function gaugeTick() { doneSources++; gaugeSet(6 + (doneSources / totalSources) * 90); }
    function withGauge(p) { return p.then(gaugeTick, gaugeTick); }

    const resultats = await Promise.allSettled([
      withGauge(typeof loadCAF === 'function' ? loadCAF() : Promise.reject(new Error('loadCAF introuvable'))),
      withGauge(typeof loadDREES === 'function' ? loadDREES() : Promise.reject(new Error('loadDREES introuvable'))),
      withGauge(typeof loadAude === 'function' ? loadAude() : Promise.reject(new Error('loadAude introuvable'))),
      withGauge(typeof loadINSEE === 'function' ? loadINSEE() : Promise.reject(new Error('loadINSEE introuvable'))),
      withGauge(typeof loadCNSA === 'function' ? loadCNSA() : Promise.reject(new Error('loadCNSA introuvable')))
    ]);
    gaugeSet(100);

    if (typeof rebuildAllMeta === 'function') rebuildAllMeta();
    if (typeof renderDashCards === 'function') renderDashCards();
    else if (typeof buildDash === 'function') buildDash();

    if (typeof renderRankIndBar === 'function') renderRankIndBar();
    if (typeof renderRankTable === 'function') renderRankTable();
    if (typeof renderEvoIndBar === 'function') renderEvoIndBar();
    if (typeof drawEvoChart === 'function') drawEvoChart();
    if (typeof renderCarteIndBar === 'function') renderCarteIndBar();
    if (typeof colorMap === 'function') colorMap();
    if (typeof buildExport === 'function' && document.getElementById('export') && document.getElementById('export').innerHTML) buildExport();

    const nbOk = resultats.filter(r => r.status === 'fulfilled').length;
    const erreurs = resultats.filter(r => r.status === 'rejected');

    if (typeof addLog === 'function') {
      if (erreurs.length === 0) {
        addLog('✅', 'Rechargement terminé : les ' + nbOk + ' sources ont été interrogées.', false);
      } else {
        addLog('⚠️', 'Rechargement terminé avec ' + nbOk + ' source(s) OK et ' + erreurs.length + ' erreur(s).', false);
      }
    }

    if (lastUpdEl) {
      const heure = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      lastUpdEl.textContent = 'Dernière MAJ : ' + heure;
    }

    if (btn) {
      btn.textContent = erreurs.length === 0 ? 'Données rechargées' : 'Rechargement partiel';
      setTimeout(() => { btn.textContent = 'Recharger données'; }, 2500);
    }
  } catch (erreur) {
    console.error('Erreur pendant le rechargement :', erreur);
    gaugeSet(0);
    if (btn) {
      btn.textContent = 'Erreur de chargement';
      setTimeout(() => { btn.textContent = 'Recharger données'; }, 3000);
    }
  } finally {
    if (btn) btn.disabled = false;
  }
}

// Graphique : l'Aude parmi les départements de sa strate (barres horizontales, Aude en orange)
function svgRankStrate(m) {
  var snap = DREES_SNAP[m.id]; if (!snap) return null;
  var codes = STRATE.slice(); if (codes.indexOf('11') < 0) codes.push('11');
  var items = codes.map(function(c) { return { c: c, v: snap[c] }; }).filter(function(x) { return typeof x.v === 'number' && !isNaN(x.v); }).sort(function(a, b) { return b.v - a.v; });
  if (items.length < 3 || !items.some(function(x) { return x.c === '11'; })) return null;
  var W = 340, rowH = 18, PL = 105, PR = 55, H = items.length * rowH + 8;
  var mx = Math.max.apply(null, items.map(function(x) { return x.v; })), mn = Math.min(0, Math.min.apply(null, items.map(function(x) { return x.v; })));
  var span = (mx - mn) || 1, bw = W - PL - PR;
  var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">';
  items.forEach(function(x, i) {
    var y = 4 + i * rowH, isA = x.c === '11', w = Math.max(1, (x.v - mn) / span * bw);
    var nm = (DEPTS[x.c] || x.c); if (nm.length > 18) nm = nm.slice(0, 17) + '…';
    out += '<text x="' + (PL - 5) + '" y="' + (y + 12) + '" font-size="9" text-anchor="end" fill="' + (isA ? '#c85a10' : '#444') + '" font-weight="' + (isA ? 800 : 400) + '">' + nm + '</text>';
    out += '<rect x="' + PL + '" y="' + (y + 2) + '" width="' + w.toFixed(1) + '" height="' + (rowH - 6) + '" fill="' + (isA ? '#ED7D31' : '#8fb2dc') + '" rx="2"/>';
    out += '<text x="' + (PL + w + 4) + '" y="' + (y + 12) + '" font-size="9" fill="#333" font-weight="' + (isA ? 800 : 400) + '">' + fmtShort(x.v, m.fmt) + '</text>';
  });
  var rk = items.findIndex(function(x) { return x.c === '11'; }) + 1;
  return { svg: out + '</svg>', rank: rk, total: items.length };
}

// Graphique : évolution de l'Aude (trait plein orange) vs moyennes Occitanie / France (pointillés)
function svgEvoAude(m) {
  var ts = DREES_TS[m.id]; if (!ts || !ts['11']) return null;
  var a = ts['11'], years = Object.keys(a).sort(); if (years.length < 2) return null;
  years = years.slice(Math.max(0, years.length - 5)); // évolution de l'Aude sur 5 ans (5 derniers millésimes disponibles)
  a = {}; years.forEach(function(y) { a[y] = ts['11'][y]; });
  var audeMean = years.reduce(function(s, y) { return s + a[y]; }, 0) / years.length;
  var series = [{ k: '11', col: '#ED7D31', lbl: 'Aude', dash: false }];
  [['OCC', '#2E7D32', 'Occitanie'], ['STR', '#B8860B', 'Strate'], ['FRA', '#4472C4', 'France']].forEach(function(o) {
    var t = ts[o[0]]; if (!t) return;
    var vs = years.map(function(y) { return t[y]; }).filter(function(v) { return typeof v === 'number'; });
    if (vs.length < 2) return;
    var mean = vs.reduce(function(s, v) { return s + v; }, 0) / vs.length;
    if (audeMean && (mean / audeMean > 20 || mean / audeMean < 0.05)) return; // échelle incohérente : non tracée
    series.push({ k: o[0], col: o[1], lbl: o[2], dash: true });
  });
  var W = 340, H = 205, PL = 46, PR = 10, PT = 10, PB = 44, cW = W - PL - PR, cH = H - PT - PB;
  var all = []; series.forEach(function(sr) { years.forEach(function(y) { var v = (ts[sr.k] || {})[y]; if (typeof v === 'number') all.push(v); }); });
  var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all), pad = (mx - mn) * 0.1 || Math.abs(mx) * 0.1 || 1;
  mn -= pad; mx += pad;
  var y0 = parseInt(years[0], 10), y1 = parseInt(years[years.length - 1], 10);
  function X(y) { return PL + (y1 === y0 ? cW / 2 : (parseInt(y, 10) - y0) / (y1 - y0) * cW); }
  function Y(v) { return PT + cH - (v - mn) / (mx - mn) * cH; }
  var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">';
  for (var i = 0; i <= 4; i++) {
    var v = mn + (mx - mn) * i / 4, yy = Y(v);
    out += '<line x1="' + PL + '" y1="' + yy.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + yy.toFixed(1) + '" stroke="#e1e5ea"/><text x="' + (PL - 4) + '" y="' + (yy + 3).toFixed(1) + '" font-size="8" text-anchor="end" fill="#777">' + fmtShort(v, m.fmt) + '</text>';
  }
  years.forEach(function(y, i) { out += '<text x="' + X(y).toFixed(1) + '" y="' + (PT + cH + 12) + '" font-size="8" text-anchor="' + (i === 0 ? 'start' : i === years.length - 1 ? 'end' : 'middle') + '" fill="#777">' + y + '</text>'; });
  series.slice().reverse().forEach(function(sr) {
    var pts = years.filter(function(y) { return typeof (ts[sr.k] || {})[y] === 'number'; });
    if (!pts.length) return;
    var d = pts.map(function(y, i) { return (i ? 'L' : 'M') + X(y).toFixed(1) + ',' + Y(ts[sr.k][y]).toFixed(1); }).join(' ');
    out += '<path d="' + d + '" fill="none" stroke="' + sr.col + '" stroke-width="' + (sr.dash ? 1.4 : 2.6) + '"' + (sr.dash ? ' stroke-dasharray="4,3"' : '') + '/>';
    if (!sr.dash) {
      pts.forEach(function(y) {
        var px = X(y), py = Y(ts[sr.k][y]);
        out += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="3" fill="' + sr.col + '"/>';
        out += '<text x="' + px.toFixed(1) + '" y="' + (py - 6).toFixed(1) + '" font-size="8" text-anchor="middle" fill="#8a3d0f" font-weight="700">' + fmtShort(ts[sr.k][y], m.fmt) + '</text>';
      });
    }
  });
  series.forEach(function(sr, i) {
    var lx = PL + i * Math.floor((W - PL - PR) / series.length), ly = H - 12;
    out += '<line x1="' + lx + '" y1="' + ly + '" x2="' + (lx + 16) + '" y2="' + ly + '" stroke="' + sr.col + '" stroke-width="' + (sr.dash ? 1.4 : 2.6) + '"' + (sr.dash ? ' stroke-dasharray="4,3"' : '') + '/><text x="' + (lx + 20) + '" y="' + (ly + 3) + '" font-size="8" fill="#444">' + sr.lbl + '</text>';
  });
  return out + '</svg>';
}

// Mini-cartographie de France pour la fiche PDF d'un indicateur : mêmes couleurs (quintiles) que
// la carte interactive, Aude mise en évidence par un liseré orange.
function svgMiniMap(m, geo) {
  var snap = DREES_SNAP[m.id];
  if (!snap || !geo) return null;
  var snapC = cleanDeptMap(snap);
  var vals = Object.keys(snapC).map(function(k){ return snapC[k]; }).filter(function(v){ return typeof v === 'number' && !isNaN(v); });
  if (vals.length < 2) return null;
  vals.sort(function(a,b){ return a-b; });
  var palette = ['#e8f1fb','#b7d3ee','#79aede','#3b7fc4','#0f4c8a'];
  var breaks = [];
  for (var q = 1; q < 5; q++) breaks.push(vals[Math.min(vals.length - 1, Math.floor(vals.length * q / 5))]);
  function classOf(v) { var c = 0; while (c < breaks.length && v >= breaks[c]) c++; return c; }
  function getColor(v) { return (typeof v !== 'number' || isNaN(v)) ? '#e5e9f0' : palette[classOf(v)]; }

  var H = 260, lonMin = -5.3, lonMax = 9.8, latMin = 41.2, latMax = 51.2;
  var W = Math.round(H * (lonMax - lonMin) * Math.cos(46.2 * Math.PI / 180) / (latMax - latMin));
  function proj(lon, lat) { return [(lon - lonMin) / (lonMax - lonMin) * W, H - (lat - latMin) / (latMax - latMin) * H]; }
  function rings2path(rings) {
    return rings.map(function(ring) {
      return ring.map(function(p, i) { var xy = proj(p[0], p[1]); return (i ? 'L' : 'M') + xy[0].toFixed(1) + ',' + xy[1].toFixed(1); }).join('') + ' Z';
    }).join(' ');
  }
  var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg">';
  var audeD = null;
  geo.features.forEach(function(f) {
    var raw = f.properties.code; if (!raw) return;
    var code = raw.length === 1 ? '0' + raw : raw;
    var d = '';
    if (f.geometry.type === 'Polygon') d = rings2path(f.geometry.coordinates);
    else if (f.geometry.type === 'MultiPolygon') d = f.geometry.coordinates.map(rings2path).join(' ');
    if (!d) return;
    out += '<path d="' + d + '" fill="' + getColor(snap[code]) + '" stroke="#ffffff" stroke-width="0.6"/>';
    if (code === '11') audeD = d;
  });
  if (audeD) {
    out += '<path d="' + audeD + '" fill="none" stroke="#1a2845" stroke-width="1.6" stroke-linejoin="round"/>';
    out += '<path d="' + audeD + '" fill="none" stroke="#ED7D31" stroke-width="0.8" stroke-linejoin="round"/>';
  }
  return out + '</svg>';
}

async function generatePdf() {
  var inds = ALL_META.filter(function(m) { return exportSel[m.id]; });
  if (!inds.length) { alert('Cochez au moins un indicateur à inclure dans le rapport.'); return; }
  function n(v, f) { return (typeof v === 'number' && !isNaN(v)) ? fmtShort(v, f) : '—'; }
  function rk(r, t) { return (r && t) ? r + '/' + t : '—'; }
  var geo = null;
  try { geo = await ensureGeo(); } catch (e) { /* pas de fond de carte disponible hors-ligne */ }

  var today = new Date().toLocaleDateString('fr-FR');
  var html = '';
  inds.forEach(function(m) {
    var rkC = exportOpts.rank ? svgRankStrate(m) : null, evC = exportOpts.evo ? svgEvoAude(m) : null;
    var mapC = exportOpts.rank ? svgMiniMap(m, geo) : null;
    function statRow(lbl, st, r, t) {
      st = st || {};
      return '<tr><td>' + lbl + '</td><td>' + n(st.mean, m.fmt) + '</td><td>' + n(st.median, m.fmt) + '</td><td>' + n(st.q1, m.fmt) + '</td><td>' + n(st.q3, m.fmt) + '</td><td><b>' + rk(r, t) + '</b></td></tr>';
    }
    html += '<div class="pdf-ind">' +
      '<div class="pdf-page-head"><span>Observatoire social — Département de l\'Aude</span><span>' + today + '</span></div>' +
      '<h3 class="pdf-title">' + m.label + (m.unit ? ' <span style="font-weight:400;color:#889;font-size:13px">(' + m.unit + ')</span>' : '') + '</h3>' +
      '<div class="pdf-value"><span class="pdf-big">Aude : ' + fmt(m.aude, m.fmt, m.unit) + '</span>' + (m.annee ? ' <span style="color:#889">(' + m.annee + ')</span>' : '') + '</div>' +
      (exportOpts.def ? '<p class="pdf-desc"><b>Définition :</b> ' + defOf(m) + '</p>' : '');
    if (exportOpts.synth) {
      html += '<table class="pdf-sum pdf-stats"><thead><tr><th>Échelle</th><th>Moyenne</th><th>Médiane</th><th>1er quartile</th><th>3e quartile</th><th>Rang de l\'Aude</th></tr></thead><tbody>' +
        statRow('Strate (' + (m.total_strate || '?') + ' dép.)', m.stats_strate, m.rank_strate, m.total_strate) +
        statRow('Occitanie (' + (m.total_occ || '?') + ' dép.)', m.stats_occ, m.rank_occ, m.total_occ) +
        statRow('France métro. (' + (m.total_fr || '?') + ' dép.)', m.stats_fr, m.rank_fr, m.total_fr) +
        '</tbody></table><div class="pdf-note">Rang 1 = valeur la plus haute.</div>';
    }
    if (exportOpts.rank || exportOpts.evo) {
      html += '<div class="pdf-charts">';
      if (exportOpts.rank) html += '<div><h4>Cartographie (France métro.)' + (mapC ? '' : ' <span class="pdf-na" style="font-size:9px">— non disponible</span>') + '</h4>' + (mapC || '<p class="pdf-na">Comparatif départemental non disponible pour cet indicateur.</p>') + '</div>';
      if (exportOpts.rank) html += '<div><h4>Classement de l\'Aude dans sa strate' + (rkC ? ' — ' + rkC.rank + 'ᵉ sur ' + rkC.total : '') + '</h4>' + (rkC ? rkC.svg : '<p class="pdf-na">Comparatif de la strate non disponible pour cet indicateur.</p>') + '</div>';
      if (exportOpts.evo) html += '<div class="wide"><h4>Évolution de l\'Aude</h4>' + (evC || '<p class="pdf-na">Série temporelle non disponible (un seul millésime publié).</p>') + '</div>';
      html += '</div>';
    }
    html += '<div class="pdf-foot"><span>Source : ' + (m.source || '') + '</span><span>Fait par le Contrôle de Gestion avec ❤️ et un peu d\'IA</span></div></div>';
  });

  document.getElementById('pdf-preview-body').innerHTML = html;
  var w = document.getElementById('pdf-preview-wrap'); w.classList.add('on');
  if (w.scrollIntoView) w.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function loadCAF() {
  try {
    addLog('⏳', 'Chargement CAF...');
    var url = 'https://data.caf.fr/api/explore/v2.1/catalog/datasets/s_ben_dep-copy/records?limit=100&where=numdep%3D%2211%22&order_by=dtreffre%20DESC';
    var r = await fetch(url);
    if (!r.ok) throw new Error('CAF HTTP '+r.status);
    var data = await r.json();
    if (!data.results || !data.results.length) throw new Error('CAF: 0 résultats');
    
    var rec = data.results[0];
    var dateRef = rec.dtreffre || 'inconnue';
    
    var prevIds = CAF_META.map(function(m){return m.id;});
    CAF_META = [];

    // Comparatif national : la CAF publie déjà une ligne par département pour chaque
    // période — on récupère tous les départements pour la même date de référence que l'Aude,
    // au lieu de ne garder que numdep="11". Plus simple que pour la DREES : pas de format long,
    // juste une colonne par indicateur, directement comparable department par département.
    var natMap = {}; // { [key]: {dept: valeur} }
    try {
      // Pas de « where » sur la date (le champ n'accepte pas la comparaison texte → HTTP 400) :
      // on lit les lignes triées par date décroissante et on garde celles de la période de l'Aude.
      var natRows = [];
      for (var pg = 0; pg < 3; pg++) {
        var natUrl = 'https://data.caf.fr/api/explore/v2.1/catalog/datasets/s_ben_dep-copy/records?limit=100&offset='+(pg*100)+'&order_by='+encodeURIComponent('dtreffre DESC');
        var rNat = await fetch(natUrl);
        if (!rNat.ok) { addLog('⚠️', 'CAF : comparatif national indisponible (HTTP '+rNat.status+'), valeurs Aude seules.'); break; }
        var dNat = await rNat.json();
        var resNat = dNat.results || [];
        var samePeriod = resNat.filter(function(rr) { return rr.dtreffre === rec.dtreffre; });
        natRows = natRows.concat(samePeriod);
        if (samePeriod.length < 100) break;
      }
      if (natRows.length) addLog('ℹ️', 'CAF : comparatif national récupéré sur '+natRows.length+' départements (période '+dateRef+').');
      natRows.forEach(function(rr) {
        if (rr.numdep == null) return;
        var dc = String(rr.numdep); if (dc.length === 1) dc = '0' + dc;
        Object.keys(rr).forEach(function(k) {
          if (typeof rr[k] !== 'number') return;
          if (!natMap[k]) natMap[k] = {};
          natMap[k][dc] = rr[k];
        });
      });
    } catch (eNat) {
      addLog('⚠️', 'CAF : comparatif national indisponible ('+eNat.message+'), valeurs Aude seules.');
    }

    var CAF_FIELDS = [
      {key:'indfoy_rsa', label:'Foyers RSA', fmt:'int', unit:'foyers', themes:['social','financier']},
      {key:'indmtt_rsa', label:'Montant RSA versé', fmt:'eur0', unit:'€', themes:['social','financier']},
      {key:'indben_aah', label:'Bénéficiaires AAH', fmt:'int', unit:'', themes:['handicap']},
      {key:'indmtt_aah', label:'Montant AAH versé', fmt:'eur0', unit:'€', themes:['handicap','financier']},
      {key:'indben_aeeh', label:'Bénéficiaires AEEH', fmt:'int', unit:'', themes:['handicap']},
      {key:'indben_ajpa', label:'Bénéficiaires AJPA', fmt:'int', unit:'', themes:['ages']},
      {key:'indmtt_ajpa', label:'Montant AJPA versé', fmt:'eur0', unit:'€', themes:['ages','financier']},
      {key:'indben_ajpp', label:'Bénéficiaires AJPP', fmt:'int', unit:'', themes:['handicap']},
      {key:'indfoy_apl', label:'Foyers APL', fmt:'int', unit:'foyers', themes:['social']},
      {key:'indmtt_apl', label:'Montant APL versé', fmt:'eur0', unit:'€', themes:['social','financier']},
      {key:'indfoy_alf', label:'Foyers ALF', fmt:'int', unit:'foyers', themes:['social']},
      {key:'indfoy_als', label:'Foyers ALS', fmt:'int', unit:'foyers', themes:['social']},
      {key:'indfoy_af', label:'Foyers allocations familiales', fmt:'int', unit:'foyers', themes:['social']},
      {key:'indmtt_af', label:'Montant AF versé', fmt:'eur0', unit:'€', themes:['social','financier']},
      {key:'indfoy_cf', label:'Foyers complément familial', fmt:'int', unit:'foyers', themes:['social']},
      {key:'indfoy_ars', label:'Foyers ARS', fmt:'int', unit:'foyers', themes:['social']},
      {key:'indfoy_asf', label:'Foyers ASF', fmt:'int', unit:'foyers', themes:['social']},
      {key:'indfoy_ppa', label:'Foyers prime activité', fmt:'int', unit:'foyers', themes:['social','financier']},
      {key:'indmtt_ppa', label:'Montant PPA versé', fmt:'eur0', unit:'€', themes:['social','financier']},
    ];
    
    var CAF_DEFS = {
      indfoy_rsa: "Nombre de foyers allocataires du revenu de solidarité active (RSA), minimum social versé aux personnes sans ressources ou à faibles ressources.",
      indmtt_rsa: "Montant total de RSA versé dans le mois aux foyers du département.",
      indben_aah: "Nombre de bénéficiaires de l'allocation aux adultes handicapés (AAH), qui garantit un revenu minimum aux personnes en situation de handicap.",
      indmtt_aah: "Montant total d'AAH versé dans le mois.",
      indben_aeeh: "Nombre de bénéficiaires de l'allocation d'éducation de l'enfant handicapé (AEEH), versée aux parents d'un enfant en situation de handicap.",
      indben_ajpa: "Nombre de bénéficiaires de l'allocation journalière du proche aidant (AJPA), versée aux salariés qui interrompent leur activité pour aider un proche.",
      indmtt_ajpa: "Montant total d'allocation journalière du proche aidant versé dans le mois.",
      indben_ajpp: "Nombre de bénéficiaires de l'allocation journalière de présence parentale (AJPP), versée aux parents d'un enfant gravement malade ou handicapé.",
      indfoy_apl: "Nombre de foyers percevant l'aide personnalisée au logement (APL), qui réduit le loyer ou les charges d'emprunt.",
      indmtt_apl: "Montant total d'APL versé dans le mois.",
      indfoy_alf: "Nombre de foyers percevant l'allocation de logement familiale (ALF), destinée aux familles et aux ménages non éligibles à l'APL.",
      indfoy_als: "Nombre de foyers percevant l'allocation de logement sociale (ALS), destinée aux ménages non éligibles à l'APL ni à l'ALF.",
      indfoy_af: "Nombre de foyers percevant les allocations familiales, versées aux familles ayant au moins deux enfants à charge.",
      indmtt_af: "Montant total d'allocations familiales versé dans le mois.",
      indfoy_cf: "Nombre de foyers percevant le complément familial, versé aux familles d'au moins trois enfants aux ressources modestes.",
      indfoy_ars: "Nombre de foyers percevant l'allocation de rentrée scolaire (ARS), versée chaque année aux familles pour la scolarité des 6-18 ans.",
      indfoy_asf: "Nombre de foyers percevant l'allocation de soutien familial (ASF), versée au parent qui élève seul un enfant.",
      indfoy_ppa: "Nombre de foyers percevant la prime d'activité, complément de revenu pour les travailleurs aux ressources modestes.",
      indmtt_ppa: "Montant total de prime d'activité versé dans le mois."
    };
    // Détection automatique : tout champ numérique de la ligne Aude non listé ci-dessus devient un indicateur
    try {
      var cafKnown = {}; CAF_FIELDS.forEach(function(f) { cafKnown[f.key] = 1; });
      var cafSchema = {};
      try {
        var rsc = await fetch('https://data.caf.fr/api/explore/v2.1/catalog/datasets/s_ben_dep-copy');
        if (rsc.ok) { var jsc = await rsc.json(); (jsc.fields || (jsc.dataset && jsc.dataset.fields) || []).forEach(function(ff) { cafSchema[ff.name] = ff; }); }
      } catch (eSc) { /* libellés déduits des noms de champs */ }
      var cafSkip = /^(numdep|dtreffre|dep|code|lib|nom|reg|annee|mois|date|geo|insee)/;
      var nbAutoCaf = 0;
      Object.keys(rec).forEach(function(k) {
        if (cafKnown[k] || cafSkip.test(k) || typeof rec[k] !== 'number') return;
        var kn = k.toLowerCase(), money = /mtt|montant|eur/.test(kn);
        var th = ['social'];
        if (/aah|aeeh|ajpp|handi/.test(kn)) th = ['handicap']; else if (/ajpa|aidant|senior|vieil/.test(kn)) th = ['ages'];
        if (money) th.push('financier');
        CAF_FIELDS.push({ key: k, auto: true,
          label: (function() {
            var l = cafSchema[k] && stripHtml(cafSchema[k].label);
            if (l && !/^[a-z0-9_]+$/.test(l)) return l;
            var fam = /^indfoy/.test(kn) ? 'Foyers allocataires' : (/^indnbp/.test(kn) ? 'Personnes couvertes' : (/^indmtt/.test(kn) ? 'Montant versé' : null));
            var restK = kn.replace(/^ind(foy|nbp|mtt)_?/, ''), restU = restK.toUpperCase();
            return (fam && restK) ? fam + ' — ' + ((ACR[restU] || ACR_CAF[restU]) ? restU : prettyName(restK)) : prettyName(l || k);
          })(),
          fmt: money ? 'eur0' : (Number.isInteger(rec[k]) ? 'int' : 'dec1'), unit: money ? '€' : '', themes: th,
          def: stripHtml(cafSchema[k] && cafSchema[k].description) });
        nbAutoCaf++;
      });
      if (nbAutoCaf) addLog('ℹ️', 'CAF : ' + nbAutoCaf + ' indicateur(s) supplémentaire(s) détecté(s) automatiquement.');
    } catch (eAuto) { /* on garde la liste configurée */ }
    CAF_FIELDS.forEach(function(f) {
      var val = rec[f.key];
      if (val === null || val === undefined) return;
      var isNew = prevIds.indexOf('caf_'+f.key) < 0;
      if (isNew && prevIds.length > 0) newCount++;

      var entry = {
        id: 'caf_'+f.key,
        label: f.label,
        unit: f.unit,
        fmt: f.fmt,
        themes: f.themes,
        aude: val,
        occ: null, fra: null,
        rank_fr: null, rank_strate: null, rank_occ: null,
        total_fr: 96, total_strate: 11, total_occ: 13,
        stats_fr: {}, stats_strate: {}, stats_occ: {},
        has_ts: false,
        source: 'CAF — données mensuelles',
        annee: dateRef,
        desc: f.auto ? '' : ((CAF_DEFS[f.key] || 'Donnée mensuelle CAF.') + ' Valeur du dernier mois publié (' + dateRef + ').'),
        descAuto: !!f.auto, descOfficial: f.auto ? f.def : '', techName: f.key,
        isNew: isNew && prevIds.length > 0
      };

      var snapMap = natMap[f.key];
      if (snapMap && Object.keys(snapMap).length > 1) {
        DREES_SNAP['caf_'+f.key] = snapMap;
        var frRes = statsAndRankFor(snapMap, null);
        var strRes = statsAndRankFor(snapMap, STRATE);
        var occRes = statsAndRankFor(snapMap, OCC);
        entry.stats_fr = frRes.stats; entry.rank_fr = frRes.rank; entry.total_fr = frRes.total; entry.fra = frRes.stats.mean;
        entry.stats_strate = strRes.stats; entry.rank_strate = strRes.rank; entry.total_strate = strRes.total;
        entry.stats_occ = occRes.stats; entry.rank_occ = occRes.rank; entry.total_occ = occRes.total; entry.occ = occRes.stats.mean;
      } else {
        DREES_SNAP['caf_'+f.key] = { '11': val };
      }

      CAF_META.push(entry);
    });
    
    // Séries d'évolution : dernier mois publié de chaque année, pour l'Aude, l'Occitanie (moy.) et la France (moy.)
    try {
      var cafBase = 'https://data.caf.fr/api/explore/v2.1/catalog/datasets/s_ben_dep-copy/records';
      var okKeys = CAF_META.map(function(m) { return m.id.replace('caf_', ''); });
      function annualOf(rows, getter) {
        var out = {};
        rows.forEach(function(rr) { // lignes triées par date décroissante : la première rencontrée par année = dernier mois
          var y = String(rr.dtreffre).slice(0, 4), v = getter(rr);
          if (out[y] === undefined && typeof v === 'number' && !isNaN(v)) out[y] = v;
        });
        return out;
      }
      var selAvg = 'dtreffre,' + okKeys.map(function(k) { return 'avg(' + k + ') as a_' + k; }).join(',');
      function cafWhere(codes) { var parts = []; codes.forEach(function(c) { parts.push('numdep="' + c + '"'); if (/^0\d$/.test(c)) parts.push('numdep="' + c.slice(1) + '"'); }); return parts.join(' OR '); }
      var occWhere = cafWhere(OCC), strWhere = cafWhere(STRATE);
      var fraWhere = cafWhere(Object.keys(DREES_DEPTS).filter(function(c) { return c !== '6AE'; })); // France métropolitaine uniquement (ni DROM ni totaux)
      var reqs = [
        fetch(cafBase + '?limit=100&order_by=' + encodeURIComponent('dtreffre DESC') + '&where=' + encodeURIComponent('numdep="11"')),
        fetch(cafBase + '?limit=100&group_by=dtreffre&order_by=' + encodeURIComponent('dtreffre DESC') + '&select=' + encodeURIComponent(selAvg) + '&where=' + encodeURIComponent(fraWhere)),
        fetch(cafBase + '?limit=100&group_by=dtreffre&order_by=' + encodeURIComponent('dtreffre DESC') + '&select=' + encodeURIComponent(selAvg) + '&where=' + encodeURIComponent(occWhere)),
        fetch(cafBase + '?limit=100&group_by=dtreffre&order_by=' + encodeURIComponent('dtreffre DESC') + '&select=' + encodeURIComponent(selAvg) + '&where=' + encodeURIComponent(strWhere))
      ];
      var resp = await Promise.all(reqs);
      var rowsA = resp[0].ok ? (await resp[0].json()).results || [] : [];
      var rowsF = resp[1].ok ? (await resp[1].json()).results || [] : [];
      var rowsO = resp[2].ok ? (await resp[2].json()).results || [] : [];
      var rowsS = resp[3].ok ? (await resp[3].json()).results || [] : [];
      var nTs = 0;
      okKeys.forEach(function(k) {
        if (setTs('caf_' + k, '11', annualOf(rowsA, function(rr) { return rr[k]; }))) {
          nTs++;
          setTs('caf_' + k, 'FRA', annualOf(rowsF, function(rr) { return rr['a_' + k]; }));
          setTs('caf_' + k, 'OCC', annualOf(rowsO, function(rr) { return rr['a_' + k]; }));
          setTs('caf_' + k, 'STR', annualOf(rowsS, function(rr) { return rr['a_' + k]; }));
        }
      });
      addLog(nTs ? 'ℹ️' : '⚠️', 'CAF : évolution annuelle chargée pour ' + nTs + ' indicateurs (HTTP ' + resp.map(function(x) { return x.status; }).join('/') + ').');
    } catch (eTs) {
      addLog('⚠️', 'CAF : séries d\'évolution indisponibles (' + eTs.message + ').');
    }
    addLog('✅', 'CAF chargée: '+CAF_META.length+' indicateurs', true);
  } catch(e) {
    addLog('❌', 'CAF erreur: '+e.message);
  }
}

        existing.aude = count;

          isNew: isNew

// ============================================================
// CNSA — Data Autonomie (data-autonomie.cnsa.fr). Plateforme Opendatasoft, comme la DREES
// et la CAF : on interroge donc directement l'API v2.1 « records », mais on découvre les
// champs du jeu de données AU MOMENT DE LA REQUÊTE plutôt que de coder en dur des noms de
// colonnes qu'on ne peut pas vérifier ici : chaque champ numérique du jeu devient un indicateur,
// avec son libellé officiel repris tel quel depuis le schéma publié par la CNSA.
// ============================================================
var CNSA_BASE = 'https://data-autonomie.cnsa.fr/api/explore/v2.1/catalog/datasets/';
// Jeu principal : synthèse des dépenses de la CNSA par habitant et des taux de couverture de
// l'offre médico-sociale (PA/PH), par département et par année.
var CNSA_DATASETS = { synthese: ['synthese_financement_branche_autonomie_pa_ph'] };
var CNSA_FIELD_CACHE = {};
var CNSA_RESOLVED_ID = {};

var DEPT_NAME2CODE = null;
// Code département (« 11 », « 011 », 11, « Aude », « AUDE », « 11 - Aude »…) → « 11 ». null si non reconnu.
function deptCodeOf(v) {
  if (v === null || v === undefined || typeof v === 'boolean') return null;
  if (!DEPT_NAME2CODE) {
    DEPT_NAME2CODE = {};
    Object.keys(DREES_DEPTS).forEach(function(c) { DEPT_NAME2CODE[normFrCnsa(DREES_DEPTS[c]).replace(/[^a-z0-9]/g, '')] = c; });
    var alias = { guadeloupe: '971', martinique: '972', guyane: '973', lareunion: '974', reunion: '974', mayotte: '976',
      cotedor: '21', cotesdarmor: '22', seinesaintdenis: '93', seinestdenis: '93', valdoise: '95', valdemarne: '94',
      hautsdeseine: '92', bouchesdurhone: '13', territoiredebelfort: '90' };
    Object.keys(alias).forEach(function(k) { if (!DEPT_NAME2CODE[k]) DEPT_NAME2CODE[k] = alias[k]; });
  }
  var str = String(v).trim().toUpperCase();
  var m = str.match(/^0*(2[AB]|\d{1,3})(?=[\s\-–:(,]|$)/);
  if (m) { var c = m[1]; return c.length === 1 ? '0' + c : c; }
  var nm = normFrCnsa(str).replace(/^departement (de la |de l'|du |des |de |d')?/, '').replace(/[^a-z0-9]/g, '');
  return DEPT_NAME2CODE[nm] || null;
}
function normFrCnsa(s) { return (s || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }

async function getCnsaFields(dsKey) {
  if (CNSA_FIELD_CACHE[dsKey]) return CNSA_FIELD_CACHE[dsKey];
  var ids = CNSA_DATASETS[dsKey];
  for (var i = 0; i < ids.length; i++) {
    try {
      var r = await fetch(CNSA_BASE + ids[i]);
      if (!r.ok) continue;
      var raw = await r.json();
      var fields = Array.isArray(raw.fields) ? raw.fields : (raw.dataset && Array.isArray(raw.dataset.fields) ? raw.dataset.fields : []);
      if (!fields.length) { addLog('⚠️', 'CNSA (' + dsKey + '/' + ids[i] + ') : pas de table interrogeable.'); continue; }
      addLog('ℹ️', 'CNSA (' + dsKey + ') : ' + fields.length + ' champs via « ' + ids[i] + ' » → ' + fields.map(function(f) { return f.name; }).join(', '));
      CNSA_RESOLVED_ID[dsKey] = ids[i];
      CNSA_FIELD_CACHE[dsKey] = fields;
      return fields;
    } catch (e) { /* essai suivant */ }
  }
  CNSA_FIELD_CACHE[dsKey] = [];
  return [];
}

// Repère le champ département / le champ année par leur nom (indépendamment des accents/casse),
// exactement comme pour la DREES : on ne connaît pas les noms exacts à l'avance.
function findCnsaDim(fields, kind) {
  if (kind === 'dept') {
    var exact = ['dep', 'departement', 'code_dep', 'code_departement', 'num_dep', 'coddep', 'dept', 'codegeo', 'code_geo'];
    var byName = fields.find(function(f) { return exact.indexOf(normFrCnsa(f.name)) >= 0; });
    if (byName) return byName.name;
    var cands = fields.filter(function(f) {
      var nm = normFrCnsa(f.name), lbl = normFrCnsa(f.label || '');
      return (nm.indexOf('dep') >= 0 || lbl.indexOf('departement') >= 0) && nm.indexOf('lib') < 0 && lbl.indexOf('libelle') < 0 && lbl.indexOf('nom') < 0;
    });
    return cands[0] ? cands[0].name : null;
  }
  var byName2 = fields.find(function(f) { return ['annee', 'annee_publication', 'annee_ref', 'year'].indexOf(normFrCnsa(f.name)) >= 0; });
  if (byName2) return byName2.name;
  var cands2 = fields.filter(function(f) { return normFrCnsa(f.label || f.name).indexOf('annee') >= 0; });
  return cands2[0] ? cands2[0].name : null;
}

var CNSA_CATALOG = 'https://data-autonomie.cnsa.fr/api/explore/v2.1/catalog/datasets';
var CNSA_MAX_ROWS = 1500; // au-delà : jeu « détaillé » (établissements, etc.), pas une table département × année

// Charge UN jeu du catalogue. Un jeu est retenu s'il a une colonne département reconnaissable et
// UNE ligne par département et par année ; chaque champ numérique devient alors un indicateur.
async function cnsaLoadDataset(dsId, info, prevIds) {
  var fields = info.fields;
  if (!fields || !fields.length) {
    var rs = await fetch(CNSA_BASE + dsId);
    if (!rs.ok) return { n: 0, why: 'schéma HTTP ' + rs.status };
    var raw = await rs.json();
    fields = Array.isArray(raw.fields) ? raw.fields : (raw.dataset && Array.isArray(raw.dataset.fields) ? raw.dataset.fields : []);
    var mm = raw.metas && (raw.metas.default || raw.metas);
    if (mm) { if (info.count == null) info.count = mm.records_count; if (!info.title) info.title = mm.title; if (!info.description) info.description = mm.description; }
  }
  if (!fields.length) return { n: 0, why: 'pas de table interrogeable' };
  if (info.count != null && info.count > CNSA_MAX_ROWS) return { n: 0, why: info.count + ' lignes : jeu détaillé' };
  var yearField = findCnsaDim(fields, 'year');

  // 1) lecture complète (sans filtre serveur : le format du département n'est pas garanti)
  var allRows = [];
  for (var pg = 0; pg < 15; pg++) {
    var rp = await fetch(CNSA_BASE + dsId + '/records?limit=100&offset=' + (pg * 100));
    if (!rp.ok) { if (pg === 0) return { n: 0, why: 'HTTP ' + rp.status }; break; }
    var dp = await rp.json(), resp = dp.results || [];
    allRows = allRows.concat(resp);
    if (resp.length < 100) break;
  }
  if (!allRows.length) return { n: 0, why: 'jeu vide' };
  if (allRows.length >= CNSA_MAX_ROWS) return { n: 0, why: 'jeu détaillé (trop de lignes)' };

  // 2) champ département : d'après les VALEURS (codes ou noms)
  var cand = fields.filter(function(f) {

    if (skipped.length) addLog('ℹ️', 'CNSA : ' + skipped.length + ' jeu(x) ignoré(s) — ' + skipped.slice(0, 15).join(' ; ') + (skipped.length > 15 ? ' …' : ''));

  }

var DREES_BASE = 'https://data.drees.solidarites-sante.gouv.fr/api/explore/v2.1/catalog/datasets/';

  if (/0-20 ans|0 a 20 ans/.test(t)) p.push('Population de référence : les 0-20 ans du département.');
